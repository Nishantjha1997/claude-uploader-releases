<style>
/* 🎨 standalone Claude Usage Analytics & ROI Dashboard — Stylesheet.html */

:root {
  /* Premium Obsidian Glass Theme Variables */
  --bg-space: #060709;
  --bg-deep: #080B14;
  --bg-card: rgba(10, 13, 23, 0.92);
  --border-glass: rgba(255, 255, 255, 0.07);
  --border-active: rgba(0, 209, 255, 0.38);
  
  /* Accent Colors */
  --accent-primary: #00D1FF;                   /* Neon Blue */
  --accent-primary-rgb: 0, 209, 255;
  --accent-success: #00E676;                   /* Luminous Green */
  --accent-warning: #FFB300;                   /* Luminous Amber */
  --accent-danger: #FF1744;                    /* Luminous Rose */
  --accent-secondary: #8A2BE2;                 /* Deep Purple */
  
  /* Text Theme */
  --text-primary: #ffffff;
  --text-secondary: #bbc9cf;
  --text-muted: #859399;
  
  /* Layout Config */
  --sidebar-width: 220px;
  --header-height: 80px;
  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --radius-lg: 8px;                            /* rounded-lg */
  --radius-md: 6px;                            /* rounded-md */
  
  /* Glowing Shadows */
  --glow-blue: 0 0 20px rgba(0, 209, 255, 0.25);
  --glow-mint: 0 0 20px rgba(0, 230, 118, 0.25);
  --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.55);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  scrollbar-width: thin;
  scrollbar-color: var(--border-active) var(--bg-deep);
}

/* Scrollbar styles */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-deep);
}
::-webkit-scrollbar-thumb {
  background: var(--border-active);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

body {
  background:
    radial-gradient(ellipse 60% 50% at 20% 60%, rgba(0, 60, 120, 0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(100, 0, 200, 0.12) 0%, transparent 60%),
    #060709;
  background-size: cover, cover, cover;
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 🏢 Layout Shell */
#app-shell {
  display: flex;
  min-height: 100vh;
}

/* 🧭 Floating Sidebar Nav */
#sidebar {
  width: var(--sidebar-width);
  background: rgba(6, 8, 14, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border-glass);
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  position: fixed;
  height: 100vh;
  z-index: 100;
  transition: var(--transition-smooth);
}

.brand-section {
  display: flex;
  align-items: center;
  margin-bottom: 2.5rem;
  padding-left: 0.5rem;
}

.logo-container {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.35rem;
  width: 100%;
}

.brand-logo {
  max-height: 38px;
  max-width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.05));
}

.brand-subtitle {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent-primary);
  font-weight: 700;
  margin-top: 2px;
}

.nav-menu {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  flex-grow: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem 1rem;
  color: var(--text-secondary);
  text-decoration: none;
  border-radius: var(--radius-md);
  font-weight: 500;
  font-size: 0.95rem;
  cursor: pointer;
  transition: var(--transition-smooth);
  border: 1px solid transparent;
  position: relative;
}

.nav-item i {
  font-size: 1.1rem;
  width: 20px;
  text-align: center;
  transition: transform 0.25s ease;
}

.nav-item:hover i {
  transform: translateY(-2px) scale(1.15);
}

.nav-item:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.03);
  border-color: rgba(255, 255, 255, 0.05);
}

.nav-item.active {
  color: var(--text-primary);
  background: rgba(59, 130, 246, 0.15);
  border-color: rgba(59, 130, 246, 0.25);
  box-shadow: var(--glow-blue);
}

.sidebar-footer {
  padding-top: 1.5rem;
  border-top: 1px solid var(--border-glass);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.refresh-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.8rem;
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  transition: var(--transition-smooth);
}

.refresh-btn:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--border-active);
}

.refresh-btn i.spinning {
  animation: spin 1s linear infinite;
}

/* 💻 Content Shell */
#content-area {
  margin-left: var(--sidebar-width);
  width: calc(100% - var(--sidebar-width));
  padding: 2rem 3rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 🖥 Header Module */
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border-glass);
}

.header-meta h1 {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 2rem;
  letter-spacing: -0.5px;
}

.header-meta p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-top: 0.25rem;
}

/* 🪟 Dashboard Pages (Tabs) */
.dashboard-page {
  display: none;
}

.dashboard-page.active {
  display: block;
  animation: pageEnter 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* 💎 Premium Glassmorphic Cards */
.glass-card {
  background: var(--bg-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-glass);
  padding: 1.75rem;
  transition: var(--transition-smooth);
  position: relative;
  overflow: hidden;
}

/* Top-edge light bar */
.glass-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.13), transparent);
  border-radius: 50%;
  pointer-events: none;
}

/* Hover shimmer sweep */
.glass-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.045) 50%, transparent 65%);
  transform: translateX(-120%);
  transition: transform 0.65s ease;
  pointer-events: none;
  z-index: 0;
}

.glass-card:hover::before {
  transform: translateX(120%);
}

.glass-card:hover {
  border-color: var(--border-active);
}

/* 📊 Stat Cards Grid */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.stat-card {
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--accent-primary);
  animation: statBarPulse 4s ease-in-out infinite;
  transform-origin: left center;
}

.stat-card.success::before { background: var(--accent-success); }
.stat-card.warning::before { background: var(--accent-warning); }
.stat-card.danger::before { background: var(--accent-danger); }
.stat-card.secondary::before { background: var(--accent-secondary); }

.stat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 0.75rem;
}

.stat-header i {
  font-size: 1.25rem;
  color: var(--text-muted);
}

.stat-value {
  font-family: 'Outfit', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.2;
}

.stat-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.stat-subtitle span.positive { color: var(--accent-success); font-weight: 600; }
.stat-subtitle span.negative { color: var(--accent-danger); font-weight: 600; }

/* ── Header action row ─────────────────────────────────── */
.header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-shrink: 0;
}

.sync-pill-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: linear-gradient(135deg, #00D1FF 0%, #0090CC 100%);
  border: none;
  color: #000;
  font-weight: 800;
  font-size: 0.8rem;
  border-radius: 8px;
  padding: 0.5rem 1rem;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(0, 209, 255, 0.4), 0 2px 8px rgba(0,0,0,0.4);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  letter-spacing: 0.2px;
}

.sync-pill-btn:hover {
  box-shadow: 0 0 28px rgba(0, 209, 255, 0.65), 0 4px 12px rgba(0,0,0,0.5);
  transform: translateY(-1px);
}

.last-refreshed-badge {
  font-size: 0.72rem;
  color: var(--text-muted);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-glass);
  border-radius: 6px;
  padding: 0.35rem 0.65rem;
  white-space: nowrap;
}

/* ── Cache hit rate progress bar ───────────────────────── */
.progress-wrap {
  background: rgba(255,255,255,0.06);
  border-radius: 100px;
  height: 5px;
  width: 80px;
  overflow: hidden;
  display: inline-block;
}

.progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-fill.high   { background: linear-gradient(90deg, #00D1FF, #00E676); }
.progress-fill.medium { background: linear-gradient(90deg, #FFB300, #FF8C00); }
.progress-fill.low    { background: linear-gradient(90deg, #FF1744, #FF6B6B); }

.progress-cell {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  justify-content: flex-end;
}

.progress-pct {
  font-size: 0.78rem;
  font-weight: 700;
  width: 36px;
  text-align: right;
}

/* ── ROI Index glow ────────────────────────────────────── */
.roi-value {
  background: linear-gradient(135deg, #00D1FF, #8A2BE2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 📉 Alert Banners */
.alert-strip {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: var(--radius-md);
  padding: 1rem 1.25rem;
  margin-bottom: 2rem;
  color: var(--accent-danger);
  font-weight: 500;
  font-size: 0.9rem;
}

.alert-strip i {
  font-size: 1.25rem;
}

.alert-strip.warning {
  background: rgba(245, 158, 11, 0.08);
  border-color: rgba(245, 158, 11, 0.2);
  color: var(--accent-warning);
}

.alert-strip.success {
  background: rgba(16, 185, 129, 0.08);
  border-color: rgba(16, 185, 129, 0.2);
  color: var(--accent-success);
}

/* 📈 Chart Area Containers */
.charts-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1.5rem;
  margin-bottom: 2rem;
}

@media (max-width: 1024px) {
  .charts-grid {
    grid-template-columns: 1fr;
  }
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

.chart-header h3 {
  font-family: 'Outfit', sans-serif;
  font-size: 1.2rem;
  font-weight: 600;
}

.chart-canvas {
  height: 300px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 👥 Leaderboard Filters & Table */
.controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.search-wrapper {
  position: relative;
  flex-grow: 1;
  max-width: 400px;
}

.search-wrapper i {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.search-input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-md);
  padding: 0.75rem 1rem 0.75rem 2.75rem;
  color: var(--text-primary);
  font-size: 0.9rem;
  transition: var(--transition-smooth);
}

.search-input:focus {
  border-color: var(--accent-primary);
  outline: none;
}

.filter-wrapper {
  display: flex;
  gap: 0.75rem;
}

.filter-select {
  background: var(--bg-deep);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-md);
  padding: 0.75rem 1.25rem;
  color: var(--text-primary);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.filter-select:focus {
  border-color: var(--accent-primary);
  outline: none;
}

.export-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--accent-primary);
  border: none;
  color: #fff;
  font-weight: 600;
  font-size: 0.85rem;
  border-radius: var(--radius-md);
  padding: 0.75rem 1.25rem;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.export-btn:hover {
  background: hsl(217, 91%, 50%);
  transform: translateY(-1px);
}

/* 📋 Roster Table Layout */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  overflow-y: auto;
  max-height: 68vh;
  border-radius: var(--radius-md);
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.9rem;
}

th {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #080b14; /* Solid dark deep background matching --bg-deep to prevent scrolling rows from showing through */
  border-bottom: 1px solid var(--border-glass);
  color: var(--text-secondary);
  font-weight: 600;
  padding: 1rem 1.25rem;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
  transition: var(--transition-smooth);
}

th:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}

th i {
  margin-left: 0.25rem;
  font-size: 0.7rem;
}

td {
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid var(--border-glass);
  vertical-align: middle;
  color: var(--text-secondary);
}

tr {
  transition: var(--transition-smooth);
}

tr:hover td {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.02);
}

tr td:first-child {
  border-left: 2px solid transparent;
  transition: border-color 0.2s ease;
}

tr:hover td:first-child {
  border-left: 2px solid var(--accent-primary);
}

/* 🏷️ Table Cells styling */
.dev-cell {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
}

.dev-meta {
  display: flex;
  flex-direction: column;
}

.dev-name {
  font-weight: 600;
  color: var(--text-primary);
}

.dev-email {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* 💊 Status Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.75rem;
  border-radius: 100px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: capitalize;
}

.pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.pill.power {
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.2);
  color: var(--accent-primary);
}
.pill.power::before { background: var(--accent-primary); }

.pill.chat {
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: var(--accent-success);
}
.pill.chat::before { background: var(--accent-success); }

.pill.code {
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.2);
  color: var(--accent-warning);
}
.pill.code::before { background: var(--accent-warning); }

.pill.low {
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--accent-danger);
}
.pill.low::before { background: var(--accent-danger); }

.pill.inactive {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
}
.pill.inactive::before { background: var(--text-muted); }

.category-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
.category-badge.power { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: var(--accent-primary); }
.category-badge.chat  { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: var(--accent-success); }
.category-badge.code  { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: var(--accent-warning); }
.category-badge.low   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: var(--accent-danger); }
.category-badge.inactive { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); }

/* 📉 SVG Sparkline */
.sparkline-container {
  width: 80px;
  height: 24px;
}

/* 🔍 Detailed User Modal Overlay */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: var(--transition-smooth);
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  width: 90%;
  max-width: 900px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: var(--radius-lg);
  transform: translateY(20px);
  transition: var(--transition-smooth);
}

.modal-overlay.active .modal-content {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-glass);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}

.modal-header h2 {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
}

.modal-close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.modal-close-btn:hover {
  color: var(--text-primary);
}

.modal-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
  .modal-grid-2 {
    grid-template-columns: 1fr;
  }
}

/* ⏳ Loading Screen skeleton wrapper */
#loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-space);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: var(--transition-smooth);
}

#loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.loader-logo {
  animation: float 3s ease-in-out infinite;
  margin-bottom: 2rem;
}

.loader-bar {
  width: 200px;
  height: 4px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 100px;
  overflow: hidden;
  position: relative;
}

.loader-progress {
  width: 40%;
  height: 100%;
  background: var(--accent-primary);
  border-radius: 100px;
  position: absolute;
  left: 0;
  top: 0;
  animation: loadingAnim 1.5s ease-in-out infinite;
}

.loader-text {
