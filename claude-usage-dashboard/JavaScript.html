<script>
/* \ud83d\ude80 standalone Claude Usage Analytics & ROI Dashboard \u2014 JavaScript.html */

// Global Configuration Constants
const LICENSE_COST_MONTHLY = 20.00; // Flat monthly fee in USD per user license

// Global Dashboard Data Payload
let dashboardPayload = null;
let currentLeaderboardSort = { colIdx: 3, desc: true }; // Sort by Cost descending by default
let currentProjectSort = { colIdx: 3, desc: true }; // Sort by Cost descending by default

// Page titles & navigation map
const pageTitles = {
  'dashboard': 'Executive Summary',
  'trends': 'Trends',
  'leaderboard': 'Developer Leaderboard',
  'projects': 'Project Analytics',
  'models': 'Models',
  'optimization': 'License Optimization',
  'export': 'Reports & Export'
};

// v2: client-side state for the freshness poller
let lastKnownMaxMtime = 0;
let freshnessPollHandle = null;

/**
 * v2: Sanitize untrusted strings before inserting into innerHTML.
 * Used everywhere a developer name, project name, or session ID is rendered
 * to close the v1 XSS gap where Windows paths or repo names could inject HTML.
 */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * v2: Lightweight inline toast (replaces alert()). Auto-dismisses after 4s.
 * variant: 'info' | 'success' | 'warn' | 'error'
 */
function showToast(message, variant) {
  variant = variant || 'info';
  const colors = {
    info:    { bg: 'rgba(37,99,235,0.18)',  border: 'rgba(37,99,235,0.4)',  fg: '#60a5fa', icon: 'fa-circle-info' },
    success: { bg: 'rgba(16,185,129,0.18)', border: 'rgba(16,185,129,0.4)', fg: '#34d399', icon: 'fa-circle-check' },
    warn:    { bg: 'rgba(245,158,11,0.18)', border: 'rgba(245,158,11,0.4)', fg: '#fbbf24', icon: 'fa-triangle-exclamation' },
    error:   { bg: 'rgba(239,68,68,0.18)',  border: 'rgba(239,68,68,0.4)',  fg: '#f87171', icon: 'fa-circle-exclamation' }
  };
  const c = colors[variant] || colors.info;
  const container = document.getElementById('toast-container');
  if (!container) { console.log('[' + variant + ']', message); return; }
  const t = document.createElement('div');
  t.style.cssText = 'pointer-events:auto;background:' + c.bg + ';border:1px solid ' + c.border + ';color:' + c.fg + ';padding:0.7rem 1rem;border-radius:8px;font-size:0.85rem;max-width:380px;display:flex;align-items:center;gap:0.5rem;box-shadow:0 8px 24px rgba(0,0,0,0.3);backdrop-filter:blur(12px);opacity:0;transform:translateX(20px);transition:all 0.25s;';
  t.innerHTML = '<i class="fa-solid ' + c.icon + '"></i><span style="flex:1;">' + esc(message) + '</span>';
  container.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(0)'; });
  setTimeout(() => {
    t.style.opacity = '0'; t.style.transform = 'translateX(20px)';
    setTimeout(() => t.remove(), 250);
  }, 4000);
}

function showInlineError(message) {
  const card = document.getElementById('inline-error-card');
  const msg = document.getElementById('inline-error-message');
  if (msg) msg.textContent = message;
  if (card) card.style.display = 'block';
}
function hideInlineError() {
  const card = document.getElementById('inline-error-card');
  if (card) card.style.display = 'none';
}

function showEmptyState(show) {
  const card = document.getElementById('empty-state-card');
  if (card) card.style.display = show ? 'block' : 'none';
}

/**
 * v2: Methodology drawer open/close + live thresholds injection
 */
function openMethodologyDrawer() {
  const drawer = document.getElementById('methodology-drawer');
  if (!drawer) return;
  // Populate live thresholds from current payload
  const liveEl = document.getElementById('methodology-live-thresholds');
  const versionEl = document.getElementById('methodology-version-tag');
  if (versionEl) versionEl.textContent = (dashboardPayload && dashboardPayload.methodologyVersion) || 'v2.0';
  if (liveEl) {
    if (dashboardPayload && dashboardPayload.orgSummary) {
      const s = dashboardPayload.orgSummary;
      liveEl.innerHTML =
        '\u2022 <strong>Reporting window:</strong> ' + esc(s.reportPeriod.from) + ' \u2192 ' + esc(s.reportPeriod.to) + ' (' + (s.reportPeriod.windowDays || 30) + ' days, anchored to last upload)<br>' +
        '\u2022 <strong>Power-user gate:</strong> cost \u2265 $5.00 in last 30 days OR \u2265 3 active days in last 30<br>' +
        '\u2022 <strong>Onboarding (new hire) window:</strong> first 14 days of activity \u2014 protected from reclamation<br>' +
        '\u2022 <strong>Inactive threshold for recency gate:</strong> > 30 days since last activity<br>' +
        '\u2022 <strong>License cost:</strong> $' + (s.licenseMonthlyFee || 20).toFixed(2) + '/user/month';
    } else {
      liveEl.textContent = 'No data loaded yet.';
    }
  }
  drawer.classList.add('active');
}
function closeMethodologyDrawer() {
  const d = document.getElementById('methodology-drawer');
  if (d) d.classList.remove('active');
}

/**
 * v2: Mobile sidebar toggle
 */
function toggleMobileSidebar() {
  const sb = document.getElementById('sidebar');
  if (sb) sb.classList.toggle('mobile-open');
}

/**
 * v2: Freshness poller \u2014 checks every 5 min whether the Drive folder has
 * newer files than what's in the cached payload. Shows a pill if so.
 */
function startFreshnessPoller() {
  if (freshnessPollHandle) clearInterval(freshnessPollHandle);
  freshnessPollHandle = setInterval(checkFreshness, 5 * 60 * 1000);
  // First check after a 30s delay so initial load completes
  setTimeout(checkFreshness, 30000);
}
function checkFreshness() {
  if (!google || !google.script) return;
  google.script.run
    .withSuccessHandler(info => {
      if (!info || !info.maxMtimeMs) return;
      if (info.maxMtimeMs > lastKnownMaxMtime + 1000) {
        const pill = document.getElementById('fresh-data-pill');
        if (pill) pill.style.display = 'inline-flex';
      }
    })
    .withFailureHandler(() => { /* silent */ })
    .getFreshnessInfo();
}

document.addEventListener('DOMContentLoaded', () => {
  setupNavigation();
  setupResponsiveSidebar();
  loadDashboardData(false);
  startFreshnessPoller();
  // Close modals/drawers with ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeMethodologyDrawer();
      if (typeof closeProjectDetailModal === 'function') closeProjectDetailModal();
    }
  });
  // Close mobile sidebar when a nav item is clicked
  document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => {
    const sb = document.getElementById('sidebar');
    if (sb) sb.classList.remove('mobile-open');
  }));
});

function setupResponsiveSidebar() {
  // Show hamburger button on narrow viewports
  function syncHamburger() {
    const t = document.getElementById('mobile-menu-toggle');
    if (!t) return;
    t.style.display = window.innerWidth < 900 ? 'block' : 'none';
  }
  syncHamburger();
  window.addEventListener('resize', syncHamburger);
}

/**
 * Handles sidebar navigation page-switches
 */
function setupNavigation() {
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      const pageId = item.getAttribute('data-page');
      
      // Update sidebar nav state
      navItems.forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');
      
      // Update active page view
      const pages = document.querySelectorAll('.dashboard-page');
      pages.forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      
      // Update header titles
      document.getElementById('page-title').innerText = pageTitles[pageId] || 'Dashboard';
      
      // Redraw charts on tab click to ensure responsiveness
      if (pageId === 'dashboard') {
        renderAllCharts();
      }
      if (pageId === 'export') {
        loadWebhookUrl();
      }
      if (pageId === 'trends') {
        renderTrendsPage();
      }
      if (pageId === 'models') {
        renderModelsPage();
      }
    });
  });
}

/**
 * Loads the dashboard dataset from Google Apps Script backend
 */
function loadDashboardData(forceSync) {
  setLoadingState(true);
  
  if (forceSync) {
    document.getElementById('refresh-icon').classList.add('spinning');
  }

  google.script.run
    .withSuccessHandler(payload => {
      document.getElementById('refresh-icon').classList.remove('spinning');
      setLoadingState(false);

      if (payload.error) {
        showInlineError('Failed to parse Drive reports: ' + payload.message);
        showToast('Failed to load dashboard', 'error');
        return;
      }

      hideInlineError();
      dashboardPayload = payload;

      // v2: top-level empty state if nothing has ever been uploaded
      if (!payload.users || payload.users.length === 0) {
        showEmptyState(true);
      } else {
        showEmptyState(false);
      }

      // Hide the fresh-data pill (we just refreshed)
      const pill = document.getElementById('fresh-data-pill');
      if (pill) pill.style.display = 'none';
      if (payload.orgSummary && payload.orgSummary.maxFileMtimeMs) {
        lastKnownMaxMtime = payload.orgSummary.maxFileMtimeMs;
      }

      populateDashboardViews();
      if (forceSync) showToast('Dashboard refreshed', 'success');
    })
    .withFailureHandler(err => {
      document.getElementById('refresh-icon').classList.remove('spinning');
      setLoadingState(false);
      showInlineError('Server connection failed: ' + err.toString());
      showToast('Connection failed', 'error');
    })
    .getDashboardData(forceSync);
}

/**
 * Controls loading skeleton overlay visibility
 */
function setLoadingState(isLoading) {
  const overlay = document.getElementById('loading-overlay');
  if (isLoading) {
    overlay.classList.remove('hidden');
  } else {
    overlay.classList.add('hidden');
  }
}

/**
 * Formats date from YYYY-MM-DD to readable format
 */
function formatReadableDate(dateStr) {
  if (!dateStr || dateStr === 'N/A') return 'N/A';
  try {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const year = parts[0];
      const month = months[parseInt(parts[1], 10) - 1] || 'Jan';
      const day = parseInt(parts[2], 10);
      return `${month} ${day}, ${year}`;
    }
    return dateStr;
  } catch (e) {
    return dateStr;
  }
}

/**
 * Maps raw model IDs to short, elegant aliases to prevent legend clutter
 */
function cleanModelName(modelId) {
  if (!modelId) return 'Other';
  const name = modelId.toLowerCase();
  
  // Extract name and version
  let family = 'Other';
  if (name.includes('sonnet')) family = 'Sonnet';
  else if (name.includes('opus')) family = 'Opus';
  else if (name.includes('haiku')) family = 'Haiku';
  
  // Try to find version patterns like "4-6", "4-7", "4-5"
  const versionMatch = name.match(/(\d+)-(\d+)/);
  if (versionMatch) {
    const major = versionMatch[1];
    const minor = versionMatch[2];
    return `${family} ${major}.${minor}`;
  }
  
  // Fallback cleaner mapping
  let clean = modelId.replace(/^claude-/i, '');
  clean = clean.split('-')[0];
  return family !== 'Other' ? family : clean.charAt(0).toUpperCase() + clean.slice(1);
}

/**
 * Formats currency in USD
 */
function formatCurrency(val) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
}

/**
 * Formats token counts nicely (e.g. 1.2M, 450K)
 */
function formatNumberAbbr(num) {
  if (num >= 1000000000) {
    return (num / 1000000000).toFixed(1) + 'B';
  }
  if (num >= 1000000) {
    return (num / 1000000).toFixed(1) + 'M';
  }
  if (num >= 1000) {
    return (num / 1000).toFixed(1) + 'K';
  }
  return num.toString();
}

/**
 * Triggers full manual Drive refresh
 */
function triggerManualSync() {
  loadDashboardData(true);
}

/**
 * Animates a numeric counter from 0 to endVal using easeOutQuart
 */
function animateCounter(el, endVal, formatter, duration) {
  duration = duration || 1200;
  const start = performance.now();
  function step(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    el.innerText = formatter(endVal * ease);
    if (p < 1) requestAnimationFrame(step);
    else el.innerText = formatter(endVal);
  }
  requestAnimationFrame(step);
}

/**
 * Populates all views on data load
 */
function populateDashboardViews() {
  if (!dashboardPayload) return;

  const summary = dashboardPayload.orgSummary;
  const LICENSE_COST_MONTHLY = summary.licenseMonthlyFee || 20;

  // Format period strings
  const fromDate = formatReadableDate(summary.reportPeriod.from);
  const toDate = formatReadableDate(summary.reportPeriod.to);
  const genDate = formatReadableDate(summary.generatedTime.substring(0, 10));
  document.getElementById('page-subtitle').innerText = `Report Period: ${fromDate} to ${toDate} | Generated: ${genDate}`;

  // v2: KPIs use period-aware values (last 30 days) instead of lifetime totals.
  // Fall back to lifetime for back-compat with older cached payloads (v1).
  const licenseCount = summary.totalLicenses;
  const period30Cost = (summary.totalCodeCost30d !== undefined) ? summary.totalCodeCost30d : summary.totalCodeCost;
  animateCounter(document.getElementById('kpi-total-cost'), period30Cost, formatCurrency, 1400);
  animateCounter(document.getElementById('kpi-subscription-spend'), summary.flatSubscriptionSpend || 0, formatCurrency, 1200);

  // v2: kpi-potential-savings element was removed from HTML; guard against null
  const potSavEl = document.getElementById('kpi-potential-savings');
  if (potSavEl) animateCounter(potSavEl, summary.potentialSavings || 0, formatCurrency, 1000);

  // v2: Period delta chip
  const deltaEl = document.getElementById('kpi-cost-delta');
  if (deltaEl) {
    const dp = (summary.costDeltaPct !== undefined && summary.costDeltaPct !== null) ? summary.costDeltaPct : null;
    if (dp === null || (!summary.totalCodeCostPrior && period30Cost === 0)) {
      deltaEl.style.display = 'none';
    } else {
      const isUp = dp >= 0;
      const arrow = isUp ? '\u25b2' : '\u25bc';
      const color = isUp ? 'var(--accent-success)' : 'var(--accent-danger)';
      deltaEl.style.display = 'inline-flex';
      deltaEl.style.background = isUp ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)';
      deltaEl.style.color = color;
      deltaEl.style.padding = '0.15rem 0.5rem';
      deltaEl.style.borderRadius = '999px';
      deltaEl.style.fontSize = '0.72rem';
      deltaEl.style.fontWeight = '700';
      deltaEl.style.marginRight = '0.5rem';
      deltaEl.textContent = arrow + ' ' + Math.abs(dp).toFixed(0) + '%';
    }
  }

  // ROI Index card \u2014 uses 30-day cost vs monthly subscription spend (apples-to-apples)
  const roiEl = document.getElementById('kpi-roi-index');
  if (roiEl) {
    const roiVal = summary.flatSubscriptionSpend > 0 ? (period30Cost / summary.flatSubscriptionSpend) : 0;
    animateCounter(roiEl, roiVal, v => v.toFixed(2) + 'x', 1300);
  }

  // Active devs counter (integer, no currency)
  const activeDevsEl = document.getElementById('kpi-active-devs');
  animateCounter(activeDevsEl, summary.activeUsersCount, v => `${Math.round(v)} / ${licenseCount}`, 1100);

  document.getElementById('kpi-utilization-rate').innerText = `Utilization Rate: ${summary.licenseUtilization}%`;

  // v2: Headline insight at the top of the page
  renderHeadlineInsight(summary);

  // Show org-level warning alert if wasted seats > 0
  const alertBanner = document.getElementById('org-action-alert');
  if (summary.potentialSavings > 0) {
    alertBanner.style.display = 'flex';
    document.getElementById('org-action-alert-text').innerText = 
      `Reclamation Alert: ${Math.round(summary.potentialSavings / LICENSE_COST_MONTHLY)} inactive license(s) detected. Reclaiming these can save ${formatCurrency(summary.potentialSavings)}/month (${formatCurrency(summary.potentialSavings * 12)}/year). Review details in License Optimization.`;
  } else {
    alertBanner.style.display = 'none';
  }

  // Populate tables and render SVG charts
  renderLeaderboardTable();
  renderOtherUsageCard();
  renderProjectTable();
  renderOptimizationTable();
  renderAllCharts();
  initRoiSimulator();
  renderAdoptionTips();
}

/**
 * Draws a 7-day sparkline SVG for a given daily history array
 */
function drawSparkline(history) {
  if (!history || history.length < 2) return '<span style="color:var(--text-muted)">\u2014</span>';
  const last7 = history.slice(-7);
  const w = 56, h = 22;
  const maxC = Math.max(...last7.map(h => h.cost), 0.001);
  const pts = last7.map((d, i) => {
    const x = (i / (last7.length - 1)) * (w - 4) + 2;
    const y = h - 2 - ((d.cost / maxC) * (h - 6));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const lastVal = last7[last7.length - 1].cost;
  const firstVal = last7[0].cost;
  const trendColor = lastVal >= firstVal * 1.05 ? 'var(--accent-danger)' : (lastVal <= firstVal * 0.95 ? 'var(--accent-success)' : 'var(--accent-warning)');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/**
 * Renders the primary Developer Leaderboard Table
 */
function renderLeaderboardTable() {
  const tbody = document.getElementById('leaderboard-table-body');
  tbody.innerHTML = '';
  
  if (!dashboardPayload || !dashboardPayload.users) return;

  // Sorting
  const sortedUsers = [...dashboardPayload.users].sort((a, b) => {
    let valA, valB;
    switch (currentLeaderboardSort.colIdx) {
      case 0: valA = a.name; valB = b.name; break;
      case 1: valA = a.category; valB = b.category; break;
      case 2: valA = a.valueScore; valB = b.valueScore; break;
      case 3: valA = a.totalCost; valB = b.totalCost; break;
      case 4: valA = a.activeDays; valB = b.activeDays; break;
      case 5: valA = a.distinctProjects; valB = b.distinctProjects; break;
      case 6: valA = a.cacheHitRate; valB = b.cacheHitRate; break;
      case 7: valA = a.lastActivity; valB = b.lastActivity; break;
      default: valA = a.totalCost; valB = b.totalCost;
    }
    
    if (typeof valA === 'string') {
      return currentLeaderboardSort.desc ? valB.localeCompare(valA) : valA.localeCompare(valB);
    }
    return currentLeaderboardSort.desc ? valB - valA : valA - valB;
  });

  sortedUsers.forEach(user => {
    const tr = document.createElement('tr');
    tr.setAttribute('data-name', user.name.toLowerCase());
    tr.setAttribute('data-category', getCategoryCode(user.category));

    const initials = user.name.split(' ').map(p => p.charAt(0)).join('').substring(0, 2);
    const catClass = getCategoryClass(user.category);
    // v2: prefer period-aware cost; fall back to lifetime for older payloads
    const displayCost = (user.costLast30d !== undefined) ? user.costLast30d : user.totalCost;
    // v2: tenure chip \u2014 onboarding < 14 days, otherwise omit
    const tenureChip = user.isNewHire
      ? '<span style="display:inline-block;margin-left:0.4rem;background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:0.6rem;font-weight:700;padding:0.1rem 0.4rem;border-radius:999px;">NEW \u00b7 ' + user.tenureDays + 'd</span>'
      : '';
    // Make the whole row clickable except for the action button
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', (e) => {
      if (e.target.closest('button')) return; // don't double-trigger from the View button
      openUserDetailModal(user.name);
    });
    const safeName = esc(user.name).replace(/'/g, "\\'");
    tr.innerHTML = `
      <td>
        <div class="dev-cell">
          <div class="avatar">${esc(initials)}</div>
          <div class="dev-meta">
            <span class="dev-name">${esc(user.name)}${tenureChip}</span>
            <span class="dev-email">${esc(user.email)}</span>
          </div>
        </div>
      </td>
      <td><span class="pill ${catClass}">${esc(user.category.substring(2))}</span></td>
      <td style="text-align: right; font-weight: 700; color: #fff;">${user.valueScore}</td>
      <td style="text-align: right; font-weight: 600; color: var(--accent-primary);">${esc(formatCurrency(displayCost))}</td>
      <td style="text-align: right;">${user.activeDays}</td>
      <td style="text-align: right;">${user.distinctProjects}</td>
      <td>
        <div class="progress-cell">
          <span class="progress-pct" style="color:${user.cacheHitRate >= 80 ? 'var(--accent-success)' : user.cacheHitRate >= 40 ? 'var(--accent-warning)' : 'var(--accent-danger)'}">${user.cacheHitRate.toFixed(0)}%</span>
          <div class="progress-wrap"><div class="progress-fill ${user.cacheHitRate >= 80 ? 'high' : user.cacheHitRate >= 40 ? 'medium' : 'low'}" style="width:${Math.min(100, user.cacheHitRate).toFixed(1)}%"></div></div>
        </div>
      </td>
      <td>
        <span style="font-size:0.85rem;font-weight:600;color:var(--text-primary);" title="Last Claude usage activity">${esc(formatReadableDate(user.lastActivity))}</span>
        <br><span style="font-size:0.7rem;color:var(--text-muted);" title="When the data file was uploaded to Drive">&#128194; Uploaded: ${user.dailyModified ? esc(formatReadableDate(user.dailyModified.substring(0,10))) : 'Unknown'}</span>
      </td>
      <td style="padding: 0.5rem 1.25rem;">${drawSparkline(user.dailyHistory)}</td>
      <td>
        <button class="export-btn" style="padding: 0.4rem 0.75rem; font-size: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);" onclick="event.stopPropagation();openUserDetailModal('${safeName}')">
          <i class="fa-solid fa-expand"></i> View
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  filterLeaderboardTable();
}

/**
 * Sorting logic for Leaderboard Table
 */
function sortLeaderboardTable(colIdx) {
  if (currentLeaderboardSort.colIdx === colIdx) {
    currentLeaderboardSort.desc = !currentLeaderboardSort.desc;
  } else {
    currentLeaderboardSort.colIdx = colIdx;
    currentLeaderboardSort.desc = true;
  }
  
  // Update UI arrows
  const headers = document.querySelectorAll('#page-leaderboard th');
  headers.forEach((h, idx) => {
    h.querySelector('i').className = 'fa-solid fa-sort';
    if (idx === colIdx) {
      h.querySelector('i').className = currentLeaderboardSort.desc ? 'fa-solid fa-sort-down' : 'fa-solid fa-sort-up';
    }
  });

  renderLeaderboardTable();
}

function getCategoryClass(cat) {
  if (cat.includes('Power')) return 'power';
  if (cat.includes('Chat-Only')) return 'chat';
  if (cat.includes('Code-Only')) return 'code';
  if (cat.includes('Low')) return 'low';
  return 'inactive';
}

function getCategoryCode(cat) {
  if (cat.includes('Power')) return 'POWER';
  if (cat.includes('Chat-Only')) return 'CHAT';
  if (cat.includes('Code-Only')) return 'CODE';
  if (cat.includes('Low')) return 'LOW';
  return 'INACTIVE';
}

/**
 * Renders the "Other Usage" summary card above the Project Analytics table.
 * Aggregates non-project sessions (ad-hoc CLI, demo/sandbox, untitled, subagents)
 * into one chip each so they don't pollute the projects list.
 */
function renderOtherUsageCard() {
  const wrap = document.getElementById('other-usage-chips');
  if (!wrap || !dashboardPayload || !dashboardPayload.projects) return;

  const KIND_META = {
    adhoc:     { icon: 'fa-terminal',    label: 'Ad-hoc CLI Sessions',     color: 'var(--accent-warning, #f59e0b)' },
    demo:      { icon: 'fa-flask',       label: 'Demo / Sandbox Sessions', color: 'var(--accent-info, #06b6d4)' },
    subagents: { icon: 'fa-robot',       label: 'Background Helpers',     color: 'var(--accent-purple, #a855f7)' },
    untitled:  { icon: 'fa-folder-open', label: 'Untitled / Home Dir',    color: 'var(--text-muted)' }
  };

  const buckets = { adhoc: null, demo: null, subagents: null, untitled: null };
  dashboardPayload.projects.forEach(p => {
    if (p.kind === 'project') return;
    const k = p.kind || 'untitled';
    if (!buckets[k]) {
      buckets[k] = { devs: {}, sessions: 0, totalCost: 0, totalTokens: 0, lastActivity: '' };
    }
    (p.devNames || []).forEach(d => buckets[k].devs[d] = true);
    buckets[k].sessions += p.sessions || 0;
    buckets[k].totalCost += p.totalCost || 0;
    buckets[k].totalTokens += p.totalTokens || 0;
    if (p.lastActivity && p.lastActivity > buckets[k].lastActivity) {
      buckets[k].lastActivity = p.lastActivity;
    }
  });

  const order = ['adhoc', 'demo', 'subagents', 'untitled'];
  const chips = order.filter(k => buckets[k]).map(k => {
    const b = buckets[k];
    const meta = KIND_META[k];
    return `
      <div class="other-usage-chip" onclick="openBucketDetail('${k}')" style="cursor:pointer;background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; transition: background 0.2s, border-color 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)';this.style.borderColor='${meta.color}'" onmouseout="this.style.background='rgba(255,255,255,0.03)';this.style.borderColor='rgba(255,255,255,0.08)'">
        <div style="display: flex; align-items: center; gap: 0.5rem; color: ${meta.color}; font-weight: 600; font-size: 0.85rem;">
          <i class="fa-solid ${meta.icon}"></i>
          <span>${esc(meta.label)}</span>
          <i class="fa-solid fa-chevron-right" style="margin-left:auto;font-size:0.7rem;opacity:0.4;"></i>
        </div>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-muted);">
          <span><strong style="color: var(--text-primary);">${Object.keys(b.devs).length}</strong> devs</span>
          <span><strong style="color: var(--text-primary);">${b.sessions}</strong> sessions</span>
          <span><strong style="color: var(--accent-primary);">${esc(formatCurrency(b.totalCost))}</strong></span>
          <span><strong style="color: var(--text-primary);">${formatNumberAbbr(b.totalTokens)}</strong> tokens</span>
        </div>
        <div style="font-size: 0.72rem; color: var(--text-muted);">Last activity: ${esc(formatReadableDate(b.lastActivity) || 'N/A')}</div>
      </div>
    `;
  }).join('');

  wrap.innerHTML = chips || '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 0.5rem;">No non-project session activity.</div>';
}

/**
 * Renders the Project Analytics Table \u2014 real projects only.
 * Buckets (ad-hoc, demo, untitled, subagents) are shown in the Other Usage card.
 */
function renderProjectTable() {
  const tbody = document.getElementById('projects-table-body');
  tbody.innerHTML = '';

  if (!dashboardPayload || !dashboardPayload.projects) return;

  const realProjects = dashboardPayload.projects.filter(p => p.kind === 'project');

  const sortedProj = [...realProjects].sort((a, b) => {
    let valA, valB;
    switch (currentProjectSort.colIdx) {
      case 0: valA = a.name; valB = b.name; break;
      case 1: valA = a.devCount; valB = b.devCount; break;
      case 2: valA = a.sessions; valB = b.sessions; break;
      case 3: valA = a.totalCost; valB = b.totalCost; break;
      case 4: valA = a.totalTokens; valB = b.totalTokens; break;
      case 5: valA = a.lastActivity; valB = b.lastActivity; break;
      default: valA = a.totalCost; valB = b.totalCost;
    }

    if (typeof valA === 'string') {
      return currentProjectSort.desc ? valB.localeCompare(valA) : valA.localeCompare(valB);
    }
    return currentProjectSort.desc ? valB - valA : valA - valB;
  });

  if (sortedProj.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.9rem;"><i class="fa-solid fa-circle-info" style="margin-right: 0.5rem;"></i>No real project activity detected. Non-project sessions are summarized in the "Other Usage" card above. Extend <code>REAL_PROJECTS</code> in Code.gs to recognize additional repo names.</td></tr>`;
    return;
  }

  sortedProj.forEach(p => {
    const tr = document.createElement('tr');
    tr.setAttribute('data-name', p.name.toLowerCase());
    const escapedName = esc(p.name).replace(/'/g, "\\'");
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      openProjectDetailModal(p.name);
    });
    tr.innerHTML = `
      <td style="font-weight: 600; color: var(--text-primary);"><i class="fa-solid fa-code-branch" style="color: var(--accent-success); margin-right: 0.5rem;"></i> ${esc(p.name)}</td>
      <td style="text-align: right;">
        <button onclick="event.stopPropagation();openProjectDevsModal('${escapedName}')" title="View contributors" style="background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.3); color: var(--accent-primary); border-radius: 12px; padding: 0.2rem 0.65rem; cursor: pointer; font-size: 0.78rem; font-weight: 700; transition: background 0.2s;" onmouseover="this.style.background='rgba(37,99,235,0.25)'" onmouseout="this.style.background='rgba(37,99,235,0.12)'">${p.devCount} <i class="fa-solid fa-user-group" style="font-size:0.6rem;opacity:0.8;"></i></button>
      </td>
      <td style="text-align: right;">${p.sessions}</td>
      <td style="text-align: right; font-weight: 600; color: var(--accent-primary);">${esc(formatCurrency(p.totalCost))}</td>
      <td style="text-align: right;">${formatNumberAbbr(p.totalTokens)}</td>
      <td>${esc(formatReadableDate(p.lastActivity))}</td>
    `;
    tbody.appendChild(tr);
  });
  
  filterProjectTable();
}

/**
 * Sorting for Project Table
 */
function sortProjectTable(colIdx) {
  if (currentProjectSort.colIdx === colIdx) {
    currentProjectSort.desc = !currentProjectSort.desc;
  } else {
    currentProjectSort.colIdx = colIdx;
    currentProjectSort.desc = true;
  }

  const headers = document.querySelectorAll('#page-projects th');
  headers.forEach((h, idx) => {
    h.querySelector('i').className = 'fa-solid fa-sort';
    if (idx === colIdx) {
      h.querySelector('i').className = currentProjectSort.desc ? 'fa-solid fa-sort-down' : 'fa-solid fa-sort-up';
    }
  });

  renderProjectTable();
}

/**
 * Renders License Optimization recommendations
 */
function renderOptimizationTable() {
  renderAdoptionTips();
  renderOnboardingStrip();
  const tbody = document.getElementById('optimization-table-body');
  tbody.innerHTML = '';

  if (!dashboardPayload || !dashboardPayload.users) return;

  // v2: skip new hires entirely from the reclamation table (they're shown in the Onboarding strip above)
  const candidates = dashboardPayload.users.filter(u =>
    !u.isNewHire && (u.category.includes('Truly Inactive') || u.category.includes('Low Engagement'))
  );

  document.getElementById('kpi-wasted-licenses').innerText = candidates.length;
  document.getElementById('kpi-annual-savings').innerText = formatCurrency(candidates.length * LICENSE_COST_MONTHLY * 12);

  if (candidates.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--accent-success); padding: 2rem; font-weight: 600;"><i class="fa-solid fa-circle-check"></i> Great job! No wasted or inactive licenses detected on this team.</td></tr>`;
    return;
  }

  candidates.forEach(user => {
    const tr = document.createElement('tr');
    const catClass = getCategoryClass(user.category);

    // v2: protection based on the same period-aware gate the server uses
    const isProtected = (user.costLast30d !== undefined ? user.costLast30d >= 5 : user.totalCost >= 10)
      || (user.activeDays30d !== undefined ? user.activeDays30d >= 3 : user.activeDays >= 3);
    const safetyPill = isProtected
      ? `<span class="pill success" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;"><i class="fa-solid fa-shield"></i> Protected</span>`
      : `<span class="pill inactive" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;"><i class="fa-solid fa-circle-minus"></i> Unprotected</span>`;

    const initials = user.name.split(' ').map(p => p.charAt(0)).join('').substring(0, 2);
    // v2: server-computed reclamation confidence (0-100) instead of hard-coded strings
    const conf = (typeof user.reclamationConfidence === 'number') ? user.reclamationConfidence : (user.category.includes('Truly') ? 99 : 80);
    const confLabel = conf >= 80 ? 'High' : conf >= 50 ? 'Medium' : conf > 0 ? 'Low' : 'Safe';
    const confColor = isProtected ? 'var(--text-muted)' : (conf >= 80 ? 'var(--accent-danger)' : conf >= 50 ? 'var(--accent-warning)' : 'var(--accent-success)');

    const safeName = esc(user.name).replace(/'/g, "\\'");
    tr.innerHTML = `
      <td>
        <div class="dev-cell">
          <div class="avatar">${esc(initials)}</div>
          <div class="dev-meta">
            <span class="dev-name">${esc(user.name)}</span>
            <span class="dev-email">${esc(user.email)}</span>
          </div>
        </div>
      </td>
      <td><span class="pill ${catClass}">${esc(user.category.substring(2))}</span></td>
      <td style="text-align: right;">${user.activeDays}</td>
      <td style="text-align: right; font-weight: 600;">${esc(formatCurrency(user.totalCost))}</td>
      <td style="text-align: right; font-weight: 700; color: #fff;">${user.valueScore}</td>
      <td>
        <span style="font-size:0.85rem;font-weight:600;color:var(--text-primary);" title="Last Claude usage activity">${esc(formatReadableDate(user.lastActivity))}</span>
        <br><span style="font-size:0.7rem;color:var(--text-muted);" title="When the data file was uploaded to Drive">&#128194; Uploaded: ${user.dailyModified ? esc(formatReadableDate(user.dailyModified.substring(0,10))) : 'Unknown'}</span>
      </td>
      <td>${safetyPill}</td>
      <td style="font-weight: 600; color: ${confColor};">${isProtected ? 'N/A' : (conf + '% ' + confLabel)}</td>
      <td>
        <div style="display:flex;gap:0.35rem;align-items:center;">
          <span style="font-weight: 600; color: ${isProtected ? 'var(--text-secondary)' : 'var(--accent-danger)'};">
            ${isProtected ? 'Keep' : (conf >= 80 ? 'Reclaim' : 'Review')}
          </span>
          ${isProtected ? '' : `<button class="export-btn" style="padding:0.3rem 0.6rem;font-size:0.7rem;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);color:#fbbf24;" onclick="sendReEngagementNudge('${safeName}')" title="Send re-engagement DM via configured webhook"><i class="fa-solid fa-paper-plane"></i> Nudge</button>`}
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/**
 * Dynamic filtering for tables
 */
function filterLeaderboardTable() {
  const query = document.getElementById('leaderboard-search').value.toLowerCase();
  const categoryFilter = document.getElementById('leaderboard-filter-category').value;
  const rows = document.querySelectorAll('#leaderboard-table-body tr');

  rows.forEach(row => {
    const name = row.getAttribute('data-name');
    const cat = row.getAttribute('data-category');
    const matchesSearch = name.includes(query);
    const matchesCat = categoryFilter === 'ALL' || cat === categoryFilter;

    if (matchesSearch && matchesCat) {
      row.style.display = 'table-row';
    } else {
      row.style.display = 'none';
    }
  });
}

function filterProjectTable() {
  const query = document.getElementById('project-search').value.toLowerCase();
  const rows = document.querySelectorAll('#projects-table-body tr');

  rows.forEach(row => {
    const name = row.getAttribute('data-name');
    if (name.includes(query)) {
      row.style.display = 'table-row';
    } else {
      row.style.display = 'none';
    }
  });
}

/**
 * Area cost line chart over time
 */
function drawOrgCostChart() {
  const container = document.getElementById('org-cost-chart');
  container.innerHTML = '';
  
  const series = dashboardPayload.dailyTimeSeries || [];
  if (series.length === 0) {
    container.innerHTML = `<p style="color: var(--text-muted);">No daily usage coordinates found.</p>`;
    return;
  }

  // Dimension setup \u2014 wider left padding so Y labels never clip
  const width = container.clientWidth || 600;
  const height = 320;
  const paddingLeft = 72;   // enough room for "$123.45"
  const paddingRight = 16;
  const paddingTop = 24;
  const paddingBottom = 44;
  const graphWidth = width - paddingLeft - paddingRight;
  const graphHeight = height - paddingTop - paddingBottom;

  // Compute scale \u2014 round up to a clean ceiling value
  const rawMax = Math.max(...series.map(d => d.totalCost), 0.01);
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const maxCost = Math.ceil(rawMax / magnitude) * magnitude;
  const totalPoints = series.length;

  // Quarter grid values
  const q1 = maxCost * 0.25;
  const q2 = maxCost * 0.50;
  const q3 = maxCost * 0.75;

  // Build polyline & fill polygon point strings
  let points = '';
  let fillPoints = `${paddingLeft},${height - paddingBottom} `;
  series.forEach((d, idx) => {
    const x = paddingLeft + (idx / (totalPoints - 1 || 1)) * graphWidth;
    const y = height - paddingBottom - (d.totalCost / maxCost) * graphHeight;
    points += `${x.toFixed(1)},${y.toFixed(1)} `;
    fillPoints += `${x.toFixed(1)},${y.toFixed(1)} `;
  });
  fillPoints += `${(paddingLeft + graphWidth).toFixed(1)},${height - paddingBottom}`;

  // Unique gradient ID to avoid conflicts when chart is redrawn
  const gradId = 'cg_' + Math.random().toString(36).slice(2, 7);

  // Format helper for compact labels: "$1.2K", "$45.60" etc.
  function fmtY(v) {
    if (v >= 1000) return '$' + (v / 1000).toFixed(1) + 'K';
    return '$' + v.toFixed(v < 10 ? 2 : 1);
  }

  // Y helper: pixel position for a given cost value
  function yPos(v) { return height - paddingBottom - (v / maxCost) * graphHeight; }

  const gridLines = [
    { v: maxCost, label: fmtY(maxCost) },
    { v: q3,      label: fmtY(q3) },
    { v: q2,      label: fmtY(q2) },
    { v: q1,      label: fmtY(q1) },
    { v: 0,       label: '$0' }
  ];

  let svgHtml = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" style="overflow:visible">
      <defs>
        <linearGradient id="neon-line-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00D1FF" />
          <stop offset="100%" stop-color="#8A2BE2" />
        </linearGradient>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="rgba(0,209,255,0.22)" />
          <stop offset="60%"  stop-color="rgba(138,43,226,0.06)" />
          <stop offset="100%" stop-color="rgba(138,43,226,0.00)" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3.5" result="blur" />
          <feComponentTransfer in="blur" result="glow1">
            <feFuncA type="linear" slope="0.6" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="glow1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <style>
          .cct-line { stroke-dasharray:4000; stroke-dashoffset:4000; animation:cctDraw 1.8s cubic-bezier(.4,0,.2,1) forwards; }
          .cct-fill { opacity:0; animation:cctFill 1s 0.6s ease forwards; }
          .cct-dot  { opacity:0; animation:cctFill 0.3s 1.8s ease forwards; }
          @keyframes cctDraw { to { stroke-dashoffset:0; } }
          @keyframes cctFill { to { opacity:1; } }
        </style>
      </defs>`;

  // \u2500\u2500 Grid lines + Y-axis labels (outside left) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  gridLines.forEach(g => {
    const y = yPos(g.v);
    const isBaseline = g.v === 0;
    svgHtml += `
      <line x1="${paddingLeft}" y1="${y.toFixed(1)}"
            x2="${paddingLeft + graphWidth}" y2="${y.toFixed(1)}"
            stroke="${isBaseline ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)'}"
            stroke-width="${isBaseline ? 1.5 : 1}" />
      <text x="${paddingLeft - 8}" y="${(y + 4).toFixed(1)}"
            text-anchor="end"
            font-family="Outfit,sans-serif" font-size="11" font-weight="600"
            fill="${isBaseline ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.82)'}">${g.label}</text>`;
  });

  // \u2500\u2500 Left vertical axis \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  svgHtml += `
    <line x1="${paddingLeft}" y1="${paddingTop}"
          x2="${paddingLeft}" y2="${height - paddingBottom}"
          stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />`;

  // \u2500\u2500 Area fill \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  svgHtml += `
    <polygon class="cct-fill" points="${fillPoints}"
             fill="url(#${gradId})" />`;

  // \u2500\u2500 Trend line \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  svgHtml += `
    <polyline class="cct-line" points="${points}"
              fill="none" stroke="url(#neon-line-grad)" stroke-width="3"
              filter="url(#neon-glow)"
              stroke-linecap="round" stroke-linejoin="round" />`;

  // \u2500\u2500 Highlight dots on non-zero points (drawn last, on top) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  series.forEach((d, idx) => {
    if (d.totalCost > 0) {
      const x = paddingLeft + (idx / (totalPoints - 1 || 1)) * graphWidth;
      const y = height - paddingBottom - (d.totalCost / maxCost) * graphHeight;
      svgHtml += `<circle class="cct-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"
                    fill="#00D1FF" stroke="rgba(255,255,255,0.95)" stroke-width="1.5" />`;
    }
  });

  // \u2500\u2500 X-axis date stamps (Start / Mid / End) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  if (totalPoints >= 2) {
    const fmt = i => {
      const d = series[i];
      if (!d) return '';
      const p = d.date.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[parseInt(p[1],10)-1]} ${parseInt(p[2],10)}`;
    };
    const midIdx = Math.floor(totalPoints / 2);
    const midX   = paddingLeft + graphWidth / 2;
    const baseline = height - paddingBottom + 18;
    svgHtml += `
      <text x="${paddingLeft}" y="${baseline}" text-anchor="start"
            font-family="Outfit,sans-serif" font-size="11" font-weight="600"
            fill="rgba(255,255,255,0.75)">${fmt(0)}</text>
      <text x="${midX.toFixed(1)}" y="${baseline}" text-anchor="middle"
            font-family="Outfit,sans-serif" font-size="11" font-weight="600"
            fill="rgba(255,255,255,0.75)">${fmt(midIdx)}</text>
      <text x="${(paddingLeft + graphWidth).toFixed(1)}" y="${baseline}" text-anchor="end"
            font-family="Outfit,sans-serif" font-size="11" font-weight="600"
            fill="rgba(255,255,255,0.75)">${fmt(totalPoints - 1)}</text>`;
  }

  svgHtml += '</svg>';
  container.innerHTML = svgHtml;
}



/**
 * Model Mix Donut Chart
 */
function drawOrgModelDonut() {
  const container = document.getElementById('org-model-chart');
  container.innerHTML = '';

  const mix = dashboardPayload.modelBreakdowns || {};
  const aggregatedMap = {};
  let totalCost = 0;

  for (let m in mix) {
    totalCost += mix[m].cost;
    const cleanName = cleanModelName(m);
    if (!aggregatedMap[cleanName]) {
      aggregatedMap[cleanName] = 0;
    }
    aggregatedMap[cleanName] += mix[m].cost;
  }

  const dataList = [];
  for (let cleanName in aggregatedMap) {
    dataList.push({ name: cleanName, cost: aggregatedMap[cleanName] });
  }

  // Sort descending by cost
  dataList.sort((a, b) => b.cost - a.cost);

  if (totalCost === 0) {
    container.innerHTML = `<p style="color: var(--text-muted);">No model metrics active.</p>`;
    return;
  }

  const width = container.clientWidth || 300;
  const height = 210;
  const cx = width / 2;
  const cy = height / 2;
  const r = 70;
  const strokeWidth = 24;

  let currentAngle = -Math.PI / 2; // Start from top

  const palette = [
    'var(--accent-primary)',
    'var(--accent-secondary)',
    'var(--accent-success)',
    'var(--accent-warning)',
    'var(--accent-danger)'
  ];

  const circumference = 2 * Math.PI * r;
  let arcAnimStyles = `<style>@keyframes arcIn { to { stroke-dashoffset: 0; } }</style>`;
  let svgHtml = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="overflow: visible;">${arcAnimStyles}`;

  dataList.forEach((d, idx) => {
    const percent = d.cost / totalCost;
    const sweepAngle = percent * 2 * Math.PI;
    const arcLen = sweepAngle * r;
    const delay = (0.1 + idx * 0.18).toFixed(2);

    // SVG Arc drawing coordinates
    const startX = cx + r * Math.cos(currentAngle);
    const startY = cy + r * Math.sin(currentAngle);

    currentAngle += sweepAngle;

    const endX = cx + r * Math.cos(currentAngle);
    const endY = cy + r * Math.sin(currentAngle);

    const largeArc = sweepAngle > Math.PI ? 1 : 0;
    const color = palette[idx % palette.length];

    svgHtml += `
      <path d="M ${startX} ${startY} A ${r} ${r} 0 ${largeArc} 1 ${endX} ${endY}"
            fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round"
            stroke-dasharray="${arcLen} 999" stroke-dashoffset="${arcLen}"
            style="animation: arcIn 0.85s ${delay}s cubic-bezier(0.4,0,0.2,1) forwards;" />
    `;
  });

  // Center Text overlay \u2014 show top model's percentage
  const topModel = dataList[0];
  const topPct = topModel ? Math.round((topModel.cost / totalCost) * 100) : 0;
  const topName = topModel ? topModel.name : '';
  svgHtml += `
    <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="26" fill="#fff">${topPct}%</text>
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" font-family="Outfit" font-size="10" font-weight="600" fill="var(--accent-primary)">${topName}</text>
    <text x="${cx}" y="${cy + 22}" text-anchor="middle" font-family="Outfit" font-size="8" font-weight="500" fill="var(--text-muted)" letter-spacing="0.5">TOP MODEL</text>
  `;

  svgHtml += '</svg>';

  // HTML flexbox legend items
  let legendHtml = `<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 16px; width: 100%; margin-top: 10px; padding: 0 10px; box-sizing: border-box;">`;
  dataList.forEach((d, idx) => {
    const color = palette[idx % palette.length];
    const nameStr = d.name;
    legendHtml += `
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-family: 'Outfit', sans-serif; font-weight: 600; white-space: nowrap;">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: ${color}; flex-shrink: 0;"></span>
        <span>${nameStr}</span>
      </div>
    `;
  });
  legendHtml += `</div>`;

  container.style.flexDirection = 'column';
  container.style.height = 'auto';
  container.innerHTML = svgHtml + legendHtml;
}

/**

 */
function drawModalTokenBar(user) {
  const container = document.getElementById('modal-token-chart');
  container.innerHTML = '';

  const input = user.inputTokens || 0;
  const output = user.outputTokens || 0;
  const cWrite = user.cacheCreationTokens || 0;
  const cRead = user.cacheReadTokens || 0;
  const total = input + output + cWrite + cRead;

  if (total === 0) {
    container.innerHTML = `<p style="color: var(--text-muted);">No token interactions logged.</p>`;
    return;
  }

  const width = container.clientWidth || 400;
  const height = 140;
  const graphWidth = width - 40;
  const barHeight = 24;

  const wInput = (input / total) * graphWidth;
  const wOutput = (output / total) * graphWidth;
  const wWrite = (cWrite / total) * graphWidth;
  const wRead = (cRead / total) * graphWidth;

  const palette = {
    input: 'var(--accent-secondary)',
    output: 'var(--accent-primary)',
    cWrite: 'var(--accent-warning)',
    cRead: 'var(--accent-success)'
  };

  let svgHtml = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%">
      <!-- Grid Header -->
      <text x="20" y="30" fill="var(--text-secondary)" font-size="11" font-weight="600">Token Distribution (Total: ${formatNumberAbbr(total)})</text>
      
      <!-- Stacked Bar Layout -->
      <g transform="translate(20, 45)">
        <rect x="0" y="0" width="${wRead}" height="${barHeight}" rx="4" fill="${palette.cRead}" />
        <rect x="${wRead}" y="0" width="${wWrite}" height="${barHeight}" rx="4" fill="${palette.cWrite}" />
        <rect x="${wRead + wWrite}" y="0" width="${wOutput}" height="${barHeight}" rx="4" fill="${palette.output}" />
        <rect x="${wRead + wWrite + wOutput}" y="0" width="${wInput}" height="${barHeight}" rx="4" fill="${palette.input}" />
      </g>
      
      <!-- Custom Legend Labels -->
      <g transform="translate(20, 95)">
        <circle cx="10" cy="5" r="4" fill="${palette.cRead}" />
        <text x="20" y="9" fill="var(--text-secondary)" font-size="10" font-weight="600">Cache Read (${((cRead/total)*100).toFixed(0)}%)</text>
        
        <circle cx="150" cy="5" r="4" fill="${palette.cWrite}" />
        <text x="160" y="9" fill="var(--text-secondary)" font-size="10" font-weight="600">Cache Write (${((cWrite/total)*100).toFixed(0)}%)</text>
        
        <circle cx="290" cy="5" r="4" fill="${palette.output}" />
        <text x="300" y="9" fill="var(--text-secondary)" font-size="10" font-weight="600">Output (${((output/total)*100).toFixed(0)}%)</text>
        
        <circle cx="400" cy="5" r="4" fill="${palette.input}" />
        <text x="410" y="9" fill="var(--text-secondary)" font-size="10" font-weight="600">Input (${((input/total)*100).toFixed(0)}%)</text>
      </g>
    </svg>
  `;
  container.innerHTML = svgHtml;
}

/**
 * \ud83d\udcbe CSV Data Export Engine
 */
function exportLeaderboardToCSV() {
  if (!dashboardPayload || !dashboardPayload.users) return;

  let csvContent = 'data:text/csv;charset=utf-8,';
  csvContent += 'Developer Name,Developer Email,Category,Value Score,Chat Score,Code Score,Equivalent Spend (USD),Active Days,Sessions Logged,Unique Projects,Cache Hit Rate %,Last Active,Primary Model\r\n';

  dashboardPayload.users.forEach(u => {
    const row = [
      `"${u.name}"`,
      `"${u.email}"`,
      `"${u.category.substring(2)}"`,
      u.valueScore,
      u.chatScore,
      u.codeScore,
      u.totalCost.toFixed(2),
      u.activeDays,
      u.totalSessions,
      u.distinctProjects,
      u.cacheHitRate.toFixed(2),
      u.lastActivity,
      `"${u.primaryModel}"`
    ].join(',');
    csvContent += row + '\r\n';
  });

  triggerFileDownload(csvContent, 'claude_developer_leaderboard.csv');
}

function exportProjectsToCSV() {
  if (!dashboardPayload || !dashboardPayload.projects) return;

  let csvContent = 'data:text/csv;charset=utf-8,';
  csvContent += 'Type,Project Name,Active Developers Count,Sessions Logged,Total Cost Contribution (USD),Total Tokens Used,Last Active\r\n';

  // Sort: real projects first, then buckets, matching dashboard ordering
  const kindOrder = { project: 0, adhoc: 1, demo: 2, subagents: 3, untitled: 4 };
  const sorted = [...dashboardPayload.projects].sort((a, b) => {
    const ka = kindOrder[a.kind] ?? 9;
    const kb = kindOrder[b.kind] ?? 9;
    if (ka !== kb) return ka - kb;
    return (b.totalCost || 0) - (a.totalCost || 0);
  });

  sorted.forEach(p => {
    const row = [
      `"${p.kind || 'project'}"`,
      `"${p.name}"`,
      p.devCount,
      p.sessions,
      p.totalCost.toFixed(2),
      p.totalTokens,
      p.lastActivity
    ].join(',');
    csvContent += row + '\r\n';
  });

  triggerFileDownload(csvContent, 'claude_project_engagement_report.csv');
}

function triggerFileDownload(content, fileName) {
  const encodedUri = encodeURI(content);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', fileName);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/**
 * Opens a print-ready executive report in a new browser window.
 * Dark-themed, fully graphical \u2014 mirrors the dashboard layout.
 */
function openPrintReport() {
  if (!dashboardPayload) return;
  var s        = dashboardPayload.orgSummary;
  var users    = dashboardPayload.users    || [];
  var projects = dashboardPayload.projects || [];

  function captureSvg(id) {
    var el = document.getElementById(id);
    if (!el) return '<p style="color:#64748b;font-size:0.8rem">Chart not available</p>';
    var svgEl = el.querySelector('svg');

/**
 * Saves webhook URL to script properties
 */
function saveWebhookConfig() {
  const url = document.getElementById('webhook-url-input').value.trim();
  const msg = document.getElementById('webhook-status-msg');
  if (!url) { msg.style.color = 'var(--accent-danger)'; msg.innerText = 'Please enter a webhook URL.'; return; }
  google.script.run
    .withSuccessHandler(() => { msg.style.color = 'var(--accent-success)'; msg.innerText = 'Webhook URL saved successfully.'; })
    .withFailureHandler(e => { msg.style.color = 'var(--accent-danger)'; msg.innerText = 'Save failed: ' + e; })
    .setWebhookConfig(url);
}

/**
 * Sends a test alert to the webhook
 */
function sendTestWebhookAlert() {
  const url = document.getElementById('webhook-url-input').value.trim();
  const msg = document.getElementById('webhook-status-msg');
  msg.style.color = 'var(--text-muted)'; msg.innerText = 'Sending test alert...';
  google.script.run
    .withSuccessHandler(r => { msg.style.color = r.success ? 'var(--accent-success)' : 'var(--accent-danger)'; msg.innerText = r.success ? 'Test alert sent! Check your channel.' : 'Alert failed (HTTP ' + r.status + ')'; })
    .withFailureHandler(e => { msg.style.color = 'var(--accent-danger)'; msg.innerText = 'Error: ' + e; })
    .sendTestAlert(url);
}

/**
 * Sends a full digest to the configured webhook
 */
function sendDigestNow() {
  const msg = document.getElementById('webhook-status-msg');
  msg.style.color = 'var(--text-muted)'; msg.innerText = 'Sending digest...';
  google.script.run
    .withSuccessHandler(r => { msg.style.color = r.success ? 'var(--accent-success)' : 'var(--accent-danger)'; msg.innerText = r.success ? 'Digest sent successfully!' : 'Failed: ' + (r.message || 'HTTP ' + r.status); })
    .withFailureHandler(e => { msg.style.color = 'var(--accent-danger)'; msg.innerText = 'Error: ' + e; })
    .sendDigestAlert();
}

/**

function loadWebhookUrl() {

/**
 * Updates the ROI simulator display based on slider value
 */
function updateRoiSimulator() {
  if (!dashboardPayload) return;
  const s = dashboardPayload.orgSummary;
  const val = parseInt(document.getElementById('sim-slider').value, 10);
  document.getElementById('sim-reclaim-count').innerText = val;

  const fee = s.licenseMonthlyFee || 20;
  const monthlySavings = val * fee;
  const annualSavings = monthlySavings * 12;
  const newLicenses = Math.max(1, s.totalLicenses - val);
  const newUtil = newLicenses > 0 ? Math.min(100, Math.round((s.activeUsersCount / newLicenses) * 100)) : 100;
  const newSubSpend = newLicenses * fee;
  // v2: ROI uses last-30-day cost (matches monthly spend timescale)
  const periodCost = (s.totalCodeCost30d !== undefined) ? s.totalCodeCost30d : s.totalCodeCost;
  const roiIdx = newSubSpend > 0 ? Math.round((periodCost / newSubSpend) * 100) : 0;

  document.getElementById('sim-monthly-savings').innerText = formatCurrency(monthlySavings);
  document.getElementById('sim-annual-savings').innerText = formatCurrency(annualSavings);
  document.getElementById('sim-new-utilization').innerText = newUtil + '%';
  document.getElementById('sim-roi-index').innerText = roiIdx + '%';
}

/**
 * Initializes the ROI simulator slider max value and resets display
 */
function initRoiSimulator() {
  if (!dashboardPayload) return;
  const s = dashboardPayload.orgSummary;
  const slider = document.getElementById('sim-slider');
  if (!slider) return;
  // v2: cap at the number of *actually reclaimable* licenses, not totalLicenses-1
  const reclaimable = (dashboardPayload.users || []).filter(u =>
    (u.category || '').indexOf('Truly Inactive') !== -1 || (u.category || '').indexOf('Low Engagement') !== -1
  ).length;
  const maxReclaim = Math.max(1, reclaimable);
  slider.max = maxReclaim;
  slider.value = 0;
  updateRoiSimulator();
}

/**
 * Auto-generated narrative summary card at the top of Executive Summary.
 * Gives managers a one-line read: "$X (\u0394%) in the last 30d, Y.Yx ROI, Z reclaimable seats."
 */
function renderHeadlineInsight(s) {
  const el = document.getElementById('exec-headline-text');
  const card = document.getElementById('exec-headline-card');
  if (!el || !card || !s) return;
  const period30 = (s.totalCodeCost30d !== undefined) ? s.totalCodeCost30d : s.totalCodeCost;
  const roi = s.flatSubscriptionSpend > 0 ? (period30 / s.flatSubscriptionSpend) : 0;
  const dp = s.costDeltaPct !== undefined ? s.costDeltaPct : null;
  const deltaText = dp === null ? '' : ' (' + (dp >= 0 ? '+' : '') + dp.toFixed(0) + '% vs prior period)';
  const wasted = Math.round((s.potentialSavings || 0) / (s.licenseMonthlyFee || 20));
  let line = 'Your team generated <strong>' + esc(formatCurrency(period30)) + '</strong> of API-equivalent value in the last 30 days' + deltaText + ', a <strong>' + roi.toFixed(2) + 'x</strong> return on the <strong>' + esc(formatCurrency(s.flatSubscriptionSpend)) + '</strong> monthly license spend.';
  if (wasted > 0) {
    line += ' <strong style="color:var(--accent-warning);">' + wasted + ' license' + (wasted === 1 ? '' : 's') + '</strong> can be reclaimed \u2014 see License Optimization.';
  } else {
    line += ' No reclaimable licenses detected.';
  }
  el.innerHTML = line;
  card.style.display = 'block';
}

/* \u2500\u2500\u2500 TRENDS PAGE \u2500\u2500\u2500 */

function renderTrendsPage() {
  if (!dashboardPayload) return;
  const s = dashboardPayload.orgSummary;
  const series = dashboardPayload.dailyTimeSeries || [];
  const users = dashboardPayload.users || [];

  // KPI tiles
  const period30 = (s.totalCodeCost30d !== undefined) ? s.totalCodeCost30d : s.totalCodeCost;
  document.getElementById('trends-kpi-30d').textContent = formatCurrency(period30);
  const deltaChip = document.getElementById('trends-kpi-30d-delta');
  if (deltaChip) {
    const dp = s.costDeltaPct !== undefined ? s.costDeltaPct : null;
    if (dp === null) { deltaChip.textContent = ''; }
    else {
      const isUp = dp >= 0;
      deltaChip.textContent = (isUp ? '\u25b2 ' : '\u25bc ') + Math.abs(dp).toFixed(0) + '%';
      deltaChip.style.color = isUp ? 'var(--accent-success)' : 'var(--accent-danger)';
      deltaChip.style.background = isUp ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)';
      deltaChip.style.padding = '0.15rem 0.5rem';
      deltaChip.style.borderRadius = '999px';
      deltaChip.style.fontWeight = '700';
      deltaChip.style.fontSize = '0.72rem';
      deltaChip.style.marginRight = '0.4rem';
    }
  }

  // This-month-so-far: sum where date prefix matches the anchor month
  const anchor = s.anchorDate || (series.length ? series[series.length - 1].date : '');
  const monthPrefix = anchor ? anchor.substring(0, 7) : '';
  const monthCost = series.filter(d => d.date && d.date.indexOf(monthPrefix) === 0).reduce((a, d) => a + d.totalCost, 0);
  document.getElementById('trends-kpi-month').textContent = formatCurrency(monthCost);
  document.getElementById('trends-kpi-month-sub').textContent = monthPrefix ? ('Month: ' + monthPrefix) : 'Calendar month to date';

  document.getElementById('trends-kpi-lifetime').textContent = formatCurrency(s.totalCodeCost || 0);
  document.getElementById('trends-kpi-cache').textContent = (s.overallCacheHitRate || 0).toFixed(1) + '%';

  // 90-day chart with prior-30 overlay (the first 30 of 90 vs the last 30)
  renderTrendsCostChart(series);

  // Per-developer small multiples
  renderTrendsSmallMultiples(users);
}

function renderTrendsCostChart(series) {
  const container = document.getElementById('trends-cost-chart');
  if (!container || series.length === 0) {
    if (container) container.innerHTML = '<div style="color:var(--text-muted);padding:2rem;text-align:center;">No data in the last 90 days.</div>';
    return;
  }
  const W = container.clientWidth || 800;
  const H = 280;
  const pad = { l: 50, r: 20, t: 20, b: 36 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const costs = series.map(d => d.totalCost);
  const maxC = Math.max(...costs, 0.001);
  const xStep = innerW / Math.max(1, series.length - 1);

  // Build the current (last 30) and prior (first 30 of 90) lines aligned to last-30 X axis
  const last30 = series.slice(-30);
  const prior30 = series.slice(-60, -30);
  const xStep30 = innerW / Math.max(1, last30.length - 1);

  function pt(arr, i, max) {
    const x = pad.l + (i * xStep30);
    const y = pad.t + innerH - ((arr[i] || 0) / max) * innerH;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }
  const c30 = last30.map(d => d.totalCost);
  const p30 = prior30.map(d => d.totalCost);
  const max30 = Math.max(...c30, ...p30, 0.001);

  const currentPts = c30.map((_, i) => pt(c30, i, max30)).join(' ');
  const priorPts = p30.map((_, i) => pt(p30, i, max30)).join(' ');

  // Gridlines
  const gridY = [];
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + (innerH * g / 4);
    const v = max30 * (1 - g / 4);
    gridY.push('<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + innerW) + '" y2="' + y + '" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>');
    gridY.push('<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">$' + v.toFixed(0) + '</text>');
  }
  // X labels: first / mid / last
  const xLabels = [0, Math.floor(last30.length / 2), last30.length - 1].map(i =>
    '<text x="' + (pad.l + i * xStep30) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="var(--text-muted)">' + esc(last30[i].date) + '</text>'
  ).join('');

  container.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
    gridY.join('') +
    (p30.length > 0
      ? '<polyline points="' + priorPts + '" fill="none" stroke="rgba(148,163,184,0.6)" stroke-width="2" stroke-dasharray="5,4"/>'
      : '') +
    '<polyline points="' + currentPts + '" fill="none" stroke="var(--accent-primary)" stroke-width="2.5" stroke-linecap="round"/>' +
    xLabels +
    '<text x="' + (pad.l + 8) + '" y="' + (pad.t + 14) + '" font-size="10" fill="var(--accent-primary)" font-weight="700">\u2014 Last 30 days</text>' +
    (p30.length > 0 ? '<text x="' + (pad.l + 120) + '" y="' + (pad.t + 14) + '" font-size="10" fill="rgba(148,163,184,0.9)" font-weight="700">- - Prior 30 days</text>' : '') +
    '</svg>';
}

function renderTrendsSmallMultiples(users) {
  const wrap = document.getElementById('trends-small-multiples');
  if (!wrap) return;
  if (!users.length) { wrap.innerHTML = '<div style="color:var(--text-muted);padding:1rem;">No developers found.</div>'; return; }
  const top = [...users].sort((a, b) => (b.costLast30d || b.totalCost) - (a.costLast30d || a.totalCost));
  wrap.innerHTML = top.map(u => {
    const hist = (u.dailyHistory || []).slice(-14);
    const max = Math.max(...hist.map(h => h.cost), 0.001);
    const w = 200, h = 50;
    const pts = hist.map((d, i) => {
      const x = (i / Math.max(1, hist.length - 1)) * (w - 6) + 3;
      const y = h - 3 - (d.cost / max) * (h - 8);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const initials = u.name.split(' ').map(p => p.charAt(0)).join('').substring(0, 2).toUpperCase();
    const period = (u.costLast30d !== undefined) ? u.costLast30d : (u.totalCost || 0);
    return '<div class="mini-trend-card" onclick="openUserDetailModal(\'' + esc(u.name).replace(/\'/g, '\\\'') + '\')" style="cursor:pointer;background:rgba(255,255,255,0.02);border:1px solid var(--border-glass);border-radius:10px;padding:0.65rem 0.75rem;transition:background 0.2s;" onmouseover="this.style.background=\'rgba(255,255,255,0.05)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.02)\'">' +
      '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.35rem;">' +
        '<div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;font-size:0.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;">' + esc(initials) + '</div>' +
        '<div style="flex:1;font-size:0.8rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(u.name) + '</div>' +
        '<div style="font-size:0.72rem;font-weight:700;color:var(--accent-primary);">' + esc(formatCurrency(period)) + '</div>' +
      '</div>' +
      (hist.length >= 2
        ? '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '"><polyline points="' + pts + '" fill="none" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round"/></svg>'
        : '<div style="height:' + h + 'px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.7rem;">No daily data</div>') +
      '</div>';
  }).join('');
}

/* \u2500\u2500\u2500 MODELS PAGE \u2500\u2500\u2500 */

function renderModelsPage() {
  if (!dashboardPayload) return;
  const breakdown = dashboardPayload.modelBreakdowns || {};
  const users = dashboardPayload.users || [];

  // KPI strip \u2014 one tile per model with cost + token count
  const modelNames = Object.keys(breakdown);
  const totalCost = modelNames.reduce((a, n) => a + breakdown[n].cost, 0);
  const kpiStrip = document.getElementById('models-kpi-strip');
  if (kpiStrip) {
    kpiStrip.innerHTML = modelNames.map(n => {
      const m = breakdown[n];
      const share = totalCost > 0 ? (m.cost / totalCost) * 100 : 0;
      return '<div class="glass-card stat-card" style="padding:0.9rem;">' +
        '<div class="stat-header"><span>' + esc(cleanModelName(n)) + '</span><i class="fa-solid fa-microchip"></i></div>' +
        '<div class="stat-value" style="font-size:1.5rem;">' + esc(formatCurrency(m.cost)) + '</div>' +
        '<div class="stat-subtitle">' + share.toFixed(1) + '% of spend \u00b7 ' + formatNumberAbbr(m.tokens) + ' tokens</div>' +
      '</div>';
    }).join('') || '<div style="color:var(--text-muted);padding:1rem;">No model usage detected.</div>';
  }

  renderModelsStackedChart(breakdown);
  renderModelsRateTable(breakdown);
  renderModelsLeakageTable(users, breakdown);
}

function renderModelsStackedChart(breakdown) {
  const container = document.getElementById('models-stacked-chart');
  if (!container) return;
  const names = Object.keys(breakdown);
  if (names.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);padding:2rem;text-align:center;">No model usage detected.</div>'; return; }

  // Build a list of dates from the first model that has a byDateSeries
  const ref = breakdown[names.find(n => breakdown[n].byDateSeries) || names[0]];
  if (!ref.byDateSeries) { container.innerHTML = '<div style="color:var(--text-muted);padding:2rem;text-align:center;">No daily data.</div>'; return; }
  const dates = ref.byDateSeries.map(d => d.date);

  const W = container.clientWidth || 800;
  const H = 300;
  const pad = { l: 50, r: 20, t: 20, b: 36 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const xStep = innerW / Math.max(1, dates.length - 1);

  // Build stacks (cumulative array per date across models)
  const cumulative = dates.map(() => 0);
  const palette = ['var(--accent-primary)', 'var(--accent-secondary)', 'var(--accent-success)', 'var(--accent-warning)', 'var(--accent-danger)', '#06b6d4', '#f97316'];
  let maxStack = 0;
  const stackEntries = names.map((n, modelIdx) => {
    const s = breakdown[n].byDateSeries || dates.map(d => ({ date: d, cost: 0 }));
    const upper = s.map((p, i) => cumulative[i] + p.cost);
    const lower = cumulative.slice();
    for (let i = 0; i < dates.length; i++) cumulative[i] = upper[i];
    maxStack = Math.max(maxStack, Math.max(...upper, 0));
    return { name: n, upper: upper, lower: lower, color: palette[modelIdx % palette.length] };
  });
  if (maxStack === 0) maxStack = 0.001;

  function toXY(i, v) {
    const x = pad.l + i * xStep;
    const y = pad.t + innerH - (v / maxStack) * innerH;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }

  const layers = stackEntries.map(layer => {
    const upPts = layer.upper.map((v, i) => toXY(i, v)).join(' ');
    const dnPts = layer.lower.map((v, i) => toXY(i, v)).reverse().join(' ');
    return '<polygon points="' + upPts + ' ' + dnPts + '" fill="' + layer.color + '" fill-opacity="0.45" stroke="' + layer.color + '" stroke-width="1.5"/>';
  }).join('');

  // Y gridlines
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + innerH * g / 4;
    const v = maxStack * (1 - g / 4);
    grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + innerW) + '" y2="' + y + '" stroke="rgba(255,255,255,0.05)"/>';
    grid += '<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">$' + v.toFixed(0) + '</text>';
  }
  // Legend
  const legend = stackEntries.map((l, i) =>
    '<g transform="translate(' + (pad.l + i * 110) + ', ' + (pad.t + 2) + ')">' +
      '<rect width="10" height="10" fill="' + l.color + '" fill-opacity="0.6"/>' +
      '<text x="14" y="9" font-size="10" fill="var(--text-primary)">' + esc(cleanModelName(l.name)) + '</text>' +
    '</g>'
  ).join('');

  const xLabels = [0, Math.floor(dates.length / 2), dates.length - 1].map(i =>
    '<text x="' + (pad.l + i * xStep) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" fill="var(--text-muted)">' + esc(dates[i]) + '</text>'
  ).join('');

  container.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' +
    grid + layers + xLabels + legend + '</svg>';
}

function renderModelsRateTable(breakdown) {
  const body = document.getElementById('models-rate-table-body');
  if (!body) return;
  const rows = Object.keys(breakdown).map(n => {
    const m = breakdown[n];
    const tokensMtok = m.tokens / 1000000;
    const rate = tokensMtok > 0 ? m.cost / tokensMtok : 0;
    return { name: n, tokens: m.tokens, cost: m.cost, rate: rate };
  }).sort((a, b) => b.cost - a.cost);
  body.innerHTML = rows.length === 0
    ? '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:1.5rem;">No model usage.</td></tr>'
    : rows.map(r =>
        '<tr>' +
          '<td style="font-weight:600;">' + esc(cleanModelName(r.name)) + '</td>' +
          '<td style="text-align:right;">' + formatNumberAbbr(r.tokens) + '</td>' +
          '<td style="text-align:right;font-weight:700;color:var(--accent-primary);">' + esc(formatCurrency(r.cost)) + '</td>' +
          '<td style="text-align:right;color:var(--text-muted);">$' + r.rate.toFixed(2) + '</td>' +
        '</tr>'
      ).join('');
}

function renderModelsLeakageTable(users, breakdown) {
  const body = document.getElementById('models-leakage-table-body');
  if (!body) return;
  // Flag developers whose Opus cost is >50% of their total but generate <100K output tokens
  const leaks = users.map(u => {
    const opus = Object.keys(u.modelCostBreakdown || {})
      .filter(m => /opus/i.test(m))
      .reduce((s, m) => s + (u.modelCostBreakdown[m] || 0), 0);
    const total = Object.values(u.modelCostBreakdown || {}).reduce((s, v) => s + v, 0);
    const share = total > 0 ? opus / total : 0;
    return { name: u.name, opusCost: opus, share: share, output: u.outputTokens || 0 };
  }).filter(x => x.share > 0.5 && x.output < 100000 && x.opusCost > 1)
    .sort((a, b) => b.opusCost - a.opusCost);

  body.innerHTML = leaks.length === 0
    ? '<tr><td colspan="4" style="text-align:center;color:var(--accent-success);padding:1.5rem;font-weight:600;"><i class="fa-solid fa-circle-check"></i> No Opus over-use detected.</td></tr>'
    : leaks.map(r =>
        '<tr>' +
          '<td style="font-weight:600;">' + esc(r.name) + '</td>' +
          '<td style="text-align:right;color:var(--accent-warning);font-weight:700;">' + esc(formatCurrency(r.opusCost)) + '</td>' +
          '<td style="text-align:right;">' + (r.share * 100).toFixed(0) + '%</td>' +
          '<td style="text-align:right;">' + formatNumberAbbr(r.output) + '</td>' +
        '</tr>'
      ).join('');
}

/* \u2500\u2500\u2500 PROJECT DETAIL MODAL \u2500\u2500\u2500 */

function openProjectDetailModal(projectName) {
  if (!dashboardPayload) return;
  const proj = (dashboardPayload.projects || []).find(p => p.name === projectName);
  if (!proj) return;
  document.getElementById('proj-detail-name').innerHTML = '<i class="fa-solid fa-code-branch" style="margin-right:0.5rem;color:var(--accent-success);"></i>' + esc(proj.name);
  document.getElementById('proj-detail-subtitle').textContent = (proj.devNames || []).length + ' contributor(s) \u00b7 last active ' + (formatReadableDate(proj.lastActivity) || 'N/A');
  document.getElementById('proj-detail-cost').textContent = formatCurrency(proj.totalCost || 0);
  document.getElementById('proj-detail-sessions').textContent = proj.sessions || 0;
  document.getElementById('proj-detail-devs').textContent = (proj.devNames || []).length;
  const cps = proj.sessions > 0 ? proj.totalCost / proj.sessions : 0;
  document.getElementById('proj-detail-cps').textContent = formatCurrency(cps);
  const list = document.getElementById('proj-detail-contributors');
  list.innerHTML = (proj.devNames || []).map(name => {
    const user = (dashboardPayload.users || []).find(u => u.name === name);
    const userCost = user ? (user.projects || []).find(p => p.name === projectName) : null;
    const c = userCost ? userCost.cost : 0;
    const initials = name.split(' ').map(p => p.charAt(0)).join('').substring(0, 2).toUpperCase();
    return '<div style="display:flex;align-items:center;gap:0.85rem;padding:0.7rem 1rem;border-bottom:1px solid var(--border-glass);cursor:pointer;" onclick="closeProjectDetailModal();openUserDetailModal(\'' + esc(name).replace(/\'/g, '\\\'') + '\')">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;font-weight:800;font-size:0.78rem;display:flex;align-items:center;justify-content:center;">' + esc(initials) + '</div>' +
      '<div style="flex:1;"><div style="font-weight:600;">' + esc(name) + '</div><div style="font-size:0.72rem;color:var(--text-muted);">' + esc((user && user.email) || '') + '</div></div>' +
      '<div style="font-weight:700;color:var(--accent-primary);">' + esc(formatCurrency(c)) + '</div>' +
    '</div>';
  }).join('') || '<div style="color:var(--text-muted);padding:1.5rem;text-align:center;">No contributor data.</div>';
  document.getElementById('project-detail-modal').classList.add('active');
}
function closeProjectDetailModal() {
  const m = document.getElementById('project-detail-modal');
  if (m) m.classList.remove('active');
}

/* \u2500\u2500\u2500 RE-ENGAGEMENT NUDGE \u2500\u2500\u2500 */

/**
 * v2: Opens a detail modal for a non-project bucket (ad-hoc / demo / etc.)
 * showing which devs contributed and how much.
 */
function openBucketDetail(kind) {
  if (!dashboardPayload) return;
  const meta = {
    adhoc:     { label: '\ud83d\udcac Ad-hoc CLI Sessions',     desc: 'Sessions whose project ID was a UUID/hash \u2014 typically one-off CLI usage from non-project directories.' },
    demo:      { label: '\ud83e\uddea Demo / Sandbox Sessions', desc: 'Sessions inside paths containing keywords like demo, sandbox, scratch, tmp, practice.' },
    subagents: { label: '\u2699 Background Helpers',      desc: 'Sub-agent sessions spawned in the background.' },
    untitled:  { label: '\ud83d\udcc2 Untitled / Home Directory', desc: 'Sessions with no recognizable project structure \u2014 typically run from a home directory or a 2-segment path.' }
  };
  const m = meta[kind] || { label: kind, desc: '' };
  // Reuse the Project Detail modal \u2014 synthesize a fake "project" entry from the bucket
  const matchingProjects = (dashboardPayload.projects || []).filter(p => p.kind === kind);
  const merged = {
    name: m.label,
    kind: kind,
    devCount: 0,
    devNames: [],
    sessions: 0,
    totalCost: 0,
    totalTokens: 0,
    lastActivity: ''
  };
  const devsSet = {};
  matchingProjects.forEach(p => {
    merged.sessions += p.sessions || 0;
    merged.totalCost += p.totalCost || 0;
    merged.totalTokens += p.totalTokens || 0;
    (p.devNames || []).forEach(d => devsSet[d] = true);
    if (p.lastActivity && p.lastActivity > merged.lastActivity) merged.lastActivity = p.lastActivity;
  });
  merged.devNames = Object.keys(devsSet);
  merged.devCount = merged.devNames.length;

  // Stash the merged bucket so openProjectDetailModal can find it
  if (!dashboardPayload._bucketDetails) dashboardPayload._bucketDetails = {};
  dashboardPayload._bucketDetails[m.label] = merged;
  // Swap a temp projects-list lookup by attaching to projects too
  const fake = Object.assign({}, merged);
  const idx = (dashboardPayload.projects || []).findIndex(p => p.name === m.label);
  if (idx === -1) dashboardPayload.projects.push(fake);

  openProjectDetailModal(m.label);
  // Annotate the subtitle with the bucket description
  const sub = document.getElementById('proj-detail-subtitle');
  if (sub) sub.innerHTML = esc(m.desc) + ' \u00b7 ' + merged.devCount + ' contributor(s)';
}

function sendReEngagementNudge(userName) {
  if (!confirm('Send a re-engagement DM to "' + userName + '" via the configured webhook?')) return;
  showToast('Sending nudge to ' + userName + '...', 'info');
  google.script.run
    .withSuccessHandler(r => {
      if (r && r.success) showToast('Nudge sent to ' + userName, 'success');
      else showToast('Nudge failed: ' + (r && r.message || 'unknown error'), 'error');
    })
    .withFailureHandler(e => showToast('Nudge failed: ' + e.toString(), 'error'))
    .sendUserNudge(userName, '');
}
