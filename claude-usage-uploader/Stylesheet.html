<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg:    #0f172a; --bg2: #13131b; --bg3: #1f1f27;
  --glass:    rgba(255,255,255,0.04);
  --glass-b:  rgba(255,255,255,0.09);
  --glass-hv: rgba(255,255,255,0.07);
  --indigo: #6366f1; --purple: #8b5cf6;
  --cyan:   #06b6d4; --green:  #10b981;
  --amber:  #f59e0b; --red:    #ef4444;
  --t1: #e4e1ed; --t2: #c7c4d7; --t3: #908fa0; --t4: #464554;
  --r: 16px; --rs: 10px; --rx: 8px;
  --shadow: 0 8px 40px rgba(0,0,0,.55);
  --glow-indigo: 0 0 24px rgba(99,102,241,.35);
  --glow-green:  0 0 16px rgba(16,185,129,.3);
  --glow-red:    0 0 16px rgba(239,68,68,.3);
  --glow-amber:  0 0 16px rgba(245,158,11,.3);
  --glow-cyan:   0 0 16px rgba(6,182,212,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 12% 4%,  rgba(99,102,241,.20) 0%,transparent 48%),
    radial-gradient(ellipse at 88% 82%, rgba(139,92,246,.14) 0%,transparent 48%),
    radial-gradient(ellipse at 55% 40%, rgba(43, 72, 78, 0.09)  0%,transparent 42%)}

/* APP SHELL */
.app-shell{display:flex;height:100vh;overflow:hidden;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:rgba(15,23,42,.92);border-right:1px solid var(--glass-b);
  backdrop-filter:blur(24px);display:flex;flex-direction:column;transition:width .3s;overflow:hidden;z-index:100}
.sidebar-brand{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--glass-b)}
.sidebar-brand img{width:36px;height:36px;border-radius:10px}
.sidebar-brand-text{font-size:13px;font-weight:700;letter-spacing:-.3px}
.sidebar-brand-sub{font-size:10px;color:var(--t3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;transition:all .2s;margin-bottom:2px;
  border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--glass-hv);color:var(--t2)}
.nav-item.active{background:rgba(99,102,241,.12);color:var(--indigo);border-color:rgba(99,102,241,.25);
  box-shadow:0 0 12px rgba(99,102,241,.15)}
.nav-item .nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-label{font-size:10px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.8px;
  padding:16px 14px 6px;user-select:none}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--glass-b);font-size:11px;color:var(--t3)}
.sidebar-footer .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);
  margin-right:6px;animation:pulse-g 2s infinite}

/* MAIN AREA */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  border-bottom:1px solid var(--glass-b);background:rgba(15,23,42,.6);backdrop-filter:blur(16px);
  flex-shrink:0;gap:12px;flex-wrap:wrap;z-index:50}
.top-bar-left{display:flex;align-items:center;gap:12px}
.page-title{font-size:18px;font-weight:700;letter-spacing:-.4px}
.top-bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* CONTENT SCROLL */
.content-scroll{flex:1;overflow-y:auto;padding:24px;max-width:1400px}

/* PAGE VIEW */
.page-view{display:none;animation:fadeUp .3s ease both}
.page-view.active{display:block}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--rs);
  padding:18px 16px;backdrop-filter:blur(12px);transition:all .3s;position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);
  box-shadow:0 8px 30px rgba(0,0,0,.4)}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--indigo),transparent);opacity:0;transition:opacity .3s}
.kpi-card:hover::after{opacity:1}
.kpi-val{font-size:28px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.kpi-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:6px;font-variant-numeric:tabular-nums}

/* ALERT RAIL */
.alert-rail{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.alert-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-size:12px;font-weight:500;border:1px solid;backdrop-filter:blur(8px)}
.alert-chip.alert-warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:var(--amber)}
.alert-chip.alert-crit{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:var(--red)}
.alert-chip.alert-info{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.3);color:var(--cyan)}
.alert-chip.alert-ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:var(--green)}

/* SECTION HEADER */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:700;letter-spacing:-.2px}
.section-sub{font-size:11px;color:var(--t3)}

/* RIGHT DRAWER */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.drawer-overlay.open{display:block;animation:fadeIn .15s ease}
.drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--bg2);
  border-left:1px solid var(--glass-b);z-index:201;transition:right .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
.drawer.open{right:0}
.drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
  border-bottom:1px solid var(--glass-b);flex-shrink:0}
.drawer-hd h3{font-size:14px;font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:20px}

/* PAGE (legacy compat) */
.page-wrap{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:28px 24px 100px;display:none}

/* SIDEBAR RESPONSIVE */
@media(max-width:860px){
  .sidebar{width:56px}
  .sidebar-brand-text,.sidebar-brand-sub,.nav-item span:not(.nav-icon),.nav-label,.sidebar-footer span{display:none}
  .nav-item{justify-content:center;padding:10px}
  .sidebar-brand{justify-content:center;padding:12px}
  .sidebar-brand img{width:28px;height:28px}
  .drawer{width:100%}
}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px}
.hd-left{display:flex;align-items:center;gap:14px}
.hd-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd-logo{width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:var(--glow-indigo)}
.hd-title{font-size:21px;font-weight:700;letter-spacing:-.5px}
.hd-sub{font-size:12px;color:var(--t3);margin-top:2px}
.hd-badge{font-size:12px;color:var(--t2);background:var(--glass);border:1px solid var(--glass-b);
  border-radius:20px;padding:5px 15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd-time{font-size:11px;color:var(--t3)}
.btn-refresh{display:inline-flex;align-items:center;gap:7px;background:var(--glass);
  border:1px solid var(--glass-b);color:var(--t1);padding:8px 18px;border-radius:var(--rx);
  font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-refresh:hover:not(:disabled){border-color:var(--indigo);background:var(--glass-hv);box-shadow:var(--glow-indigo)}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed}
.btn-refresh.loading{animation:pulse-btn 1s ease-in-out infinite}
@keyframes pulse-btn{0%,100%{opacity:1}50%{opacity:.55}}

/* CARD */
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);
  padding:24px;margin-bottom:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);transition:border-color .25s,transform .25s,box-shadow .25s;
  animation:fadeUp .4s ease both}
.card:hover{border-color:rgba(255,255,255,.15);transform:scale(1.005);box-shadow:0 12px 50px rgba(0,0,0,.65)}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.16s}
.card:nth-child(5){animation-delay:.20s}.card:nth-child(6){animation-delay:.24s}
.card:nth-child(7){animation-delay:.28s}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.card-hd-left{display:flex;align-items:center;gap:10px}
.card-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.ci-indigo{background:rgba(99,102,241,.18);box-shadow:0 0 12px rgba(99,102,241,.2)}
.ci-green {background:rgba(16,185,129,.18);box-shadow:0 0 12px rgba(16,185,129,.2)}
.ci-cyan  {background:rgba(6,182,212,.18); box-shadow:0 0 12px rgba(6,182,212,.2)}
.ci-amber {background:rgba(245,158,11,.18);box-shadow:0 0 12px rgba(245,158,11,.2)}
.ci-red   {background:rgba(239,68,68,.18); box-shadow:0 0 12px rgba(239,68,68,.2)}
.ci-purple{background:rgba(139,92,246,.18);box-shadow:0 0 12px rgba(139,92,246,.2)}
.card-title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.card-subtitle{font-size:12px;color:var(--t3);margin-top:2px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--rs);
  padding:18px;text-align:center;transition:all .25s}
.stat-box:hover{transform:translateY(-3px);border-color:var(--indigo);box-shadow:var(--glow-indigo)}
.stat-val{font-size:30px;font-weight:800;letter-spacing:-1.5px}
.stat-lbl{font-size:11px;color:var(--t3);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sv-indigo{background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-green {color:var(--green)} .sv-red{color:var(--red)} .sv-amber{color:var(--amber)} .sv-cyan{color:var(--cyan)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;
  letter-spacing:.7px;text-transform:uppercase;color:var(--t3);
  border-bottom:1px solid var(--glass-b);white-space:nowrap}
.data-table tbody td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.04);
  color:var(--t1);vertical-align:middle}
.data-table tbody tr{transition:background .15s}
.data-table tbody tr:hover{background:rgba(255,255,255,.035)}
.data-table tbody tr:last-child td{border-bottom:none}
.clickable-row{cursor:pointer}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.b-green {background:rgba(16,185,129,.14);color:var(--green);border:1px solid rgba(16,185,129,.3);box-shadow:0 0 8px rgba(16,185,129,.2)}
.b-red   {background:rgba(239,68,68,.14); color:var(--red);  border:1px solid rgba(239,68,68,.3); box-shadow:0 0 8px rgba(239,68,68,.2)}
.b-amber {background:rgba(245,158,11,.14);color:var(--amber);border:1px solid rgba(245,158,11,.3);box-shadow:0 0 8px rgba(245,158,11,.2)}
.b-grey  {background:rgba(144,143,160,.12);color:var(--t3); border:1px solid rgba(144,143,160,.25)}
.b-indigo{background:rgba(99,102,241,.14);color:var(--indigo);border:1px solid rgba(99,102,241,.3);box-shadow:0 0 8px rgba(99,102,241,.2)}
.b-cyan  {background:rgba(6,182,212,.14); color:var(--cyan);  border:1px solid rgba(6,182,212,.3); box-shadow:0 0 8px rgba(6,182,212,.2)}
.b-purple{background:rgba(139,92,246,.14);color:var(--purple);border:1px solid rgba(139,92,246,.3);box-shadow:0 0 8px rgba(139,92,246,.2)}

/* STATUS DOT */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-online {background:var(--green);box-shadow:0 0 10px rgba(16,185,129,.8);animation:pulse-g 2s infinite}
.dot-waiting{background:var(--cyan); box-shadow:0 0 8px rgba(6,182,212,.6); animation:pulse-c 2s infinite}
.dot-away   {background:var(--amber);box-shadow:0 0 7px rgba(245,158,11,.5)}
.dot-offline{background:var(--t4)}
.status-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}
@keyframes pulse-g{0%,100%{box-shadow:0 0 4px rgba(16,185,129,.5)}50%{box-shadow:0 0 14px rgba(16,185,129,.95)}}
@keyframes pulse-c{0%,100%{box-shadow:0 0 4px rgba(6,182,212,.5)}50%{box-shadow:0 0 14px rgba(6,182,212,.95)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;
  border-radius:var(--rx);font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed!important;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.35)}
.btn-primary:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-indigo);transform:translateY(-1px)}
.btn-cyan{background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;box-shadow:0 2px 10px rgba(6,182,212,.3)}
.btn-cyan:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-cyan);transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 10px rgba(16,185,129,.3)}
.btn-green:hover:not(:disabled){opacity:.9;box-shadow:var(--glow-green);transform:translateY(-1px)}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-red:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-b);color:var(--t2)}
.btn-ghost:hover:not(:disabled){border-color:var(--indigo);color:var(--t1);background:var(--glass-hv)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-queued{background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);color:var(--green);pointer-events:none}
.btn-pinged{background:rgba(6,182,212,.14); border:1px solid rgba(6,182,212,.35); color:var(--cyan); pointer-events:none}
.action-cell{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* PROGRESS TRACKER */
.prog-row td{padding:0!important;border-bottom:1px solid rgba(255,255,255,.04)}
.prog-inner{display:none;padding:18px 22px;background:rgba(99,102,241,.06);
  border-top:1px solid rgba(99,102,241,.18)}
.prog-inner.open{display:block;animation:fadeIn .25s ease}
.prog-steps{display:flex;align-items:center;margin-bottom:10px}
.prog-step{display:flex;align-items:center;gap:7px}
.prog-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-b);
  color:var(--t3);position:relative;z-index:1;transition:all .4s}
.prog-icon.active{background:rgba(99,102,241,.25);border-color:var(--indigo);color:var(--indigo);box-shadow:var(--glow-indigo)}
.prog-icon.done  {background:rgba(16,185,129,.2);border-color:var(--green); color:var(--green); box-shadow:var(--glow-green)}
.prog-icon.error {background:rgba(239,68,68,.2); border-color:var(--red);   color:var(--red);   box-shadow:var(--glow-red)}
.prog-icon.spinning::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--indigo);animation:spin .75s linear infinite}
.prog-connector{flex:1;height:2px;background:rgba(255,255,255,.08);margin:0 6px;min-width:24px;position:relative;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .6s ease}
.prog-fill.done{width:100%}
.prog-labels{display:flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--t3);text-transform:uppercase}
.prog-lbl{flex:1;text-align:center}
.prog-lbl:first-child{text-align:left}
.prog-lbl:last-child{text-align:right;flex:0;min-width:48px}
.prog-lbl.active{color:var(--indigo)}.prog-lbl.done{color:var(--green)}.prog-lbl.error{color:var(--red)}
.prog-msg{font-size:11px;color:var(--t3);margin-top:7px}
.prog-countdown{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);
  margin-top:5px;display:inline-flex;align-items:center;gap:5px}
.prog-countdown::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--cyan);animation:pulse-c 1.5s infinite}

/* TIMELINE */
.timeline-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tl-filter{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid var(--glass-b);background:var(--glass);color:var(--t3);
  transition:all .2s}
.tl-filter.active,.tl-filter:hover{border-color:var(--indigo);color:var(--indigo);background:rgba(99,102,241,.1)}
.timeline{padding:4px 0}
.tl-item{display:flex;gap:14px;padding:11px 0 11px 22px;border-left:2px solid rgba(255,255,255,.07);
  margin-left:8px;position:relative;animation:fadeLeft .2s ease both}
.tl-item::before{content:'';position:absolute;left:-5px;top:18px;width:8px;height:8px;
  border-radius:50%;background:var(--t4);border:2px solid var(--bg2)}
.tl-item.tl-success::before  {background:var(--green); box-shadow:var(--glow-green)}
.tl-item.tl-failure::before  {background:var(--red);   box-shadow:var(--glow-red)}
.tl-item.tl-heartbeat::before,.tl-item.tl-waiting::before{background:var(--cyan)}
.tl-item.tl-pong::before     {background:var(--cyan)}
.tl-item.tl-generate::before {background:var(--indigo);box-shadow:var(--glow-indigo)}
.tl-item.tl-upload::before   {background:var(--purple)}
.tl-item.tl-ack::before      {background:var(--indigo);box-shadow:var(--glow-indigo)}
.tl-item.tl-registered::before{background:var(--green);box-shadow:var(--glow-green)}
.tl-item.tl-updated::before  {background:var(--amber); box-shadow:var(--glow-amber)}
.tl-ts{font-size:11px;color:var(--t3);white-space:nowrap;min-width:140px;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;padding-top:2px;cursor:help}
.tl-body{flex:1}
.tl-msg{font-size:12px;color:var(--t3);margin-top:4px;word-break:break-word;
  font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.03);
  padding:4px 8px;border-radius:4px;border-left:2px solid var(--t4)}

/* MODAL */
.modal{display:none;position:fixed;z-index:9000;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
.modal.open{display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal-box{background:var(--bg2);border:1px solid var(--glass-b);border-radius:var(--r);
  width:100%;max-width:700px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 28px 90px rgba(0,0,0,.75);animation:slideUp .25s ease}
.modal-hd{display:flex;align-items:center;justify-content:space-between;
